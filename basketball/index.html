<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hoops Trivia</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
:root{
  --bg:#07090f; --panel:#10151d; --ink:#f3f7f8; --muted:#9fb0b8; --line:#2b3a44;
  --orange:#ff8a2b; --cyan:#42e8f5; --green:#56e39f; --pink:#ff4fa3; --gold:#ffd166;
  --px:"Press Start 2P","Courier New",monospace; --vt:"VT323","Courier New",monospace;
  color-scheme:dark;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#07090f;}}
:root[data-theme="dark"]{--bg:#07090f;}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100%;background:radial-gradient(ellipse at 50% -10%,#3a1a08,var(--bg) 60%);background-color:var(--bg);color:var(--ink);font-family:var(--vt);font-size:21px;display:flex;justify-content:center;padding:16px 12px 28px}
main{width:100%;max-width:480px}
h1{font:clamp(16px,5vw,22px)/1.3 var(--px);text-align:center;margin:4px 0 14px;color:#fff;text-shadow:0 0 6px var(--orange),0 0 18px var(--orange),0 0 36px var(--orange)}
.hud{display:flex;justify-content:space-between;gap:8px;font:9px/1.6 var(--px);color:var(--muted);margin-bottom:8px}
.hud b{display:block;font-size:13px;color:var(--gold);font-weight:400}
.hud .s b{color:var(--cyan)}
.hud .f b{color:var(--orange)}
.timer{height:9px;background:#1a2230;border:1px solid var(--line);margin-bottom:10px}
.timer i{display:block;height:100%;width:100%;background:var(--cyan);box-shadow:0 0 10px var(--cyan);transition:width .1s linear}
.timer.low i{background:var(--pink);box-shadow:0 0 12px var(--pink)}
.court{border:3px solid var(--line);background:linear-gradient(#0d1420,#1b1008);box-shadow:5px 5px 0 #000;margin-bottom:12px}
.court svg{display:block;width:100%;height:auto}
.net{transform-origin:200px 100px}
.net.swish{animation:swish .5s}
@keyframes swish{30%{transform:scaleY(1.25) scaleX(.9)}60%{transform:scaleY(.95)}}
.rimhit{animation:clank .35s}
@keyframes clank{25%{transform:translateX(3px)}60%{transform:translateX(-2px)}}
.banner{position:absolute;left:0;right:0;top:12px;text-align:center;font:12px var(--px);pointer-events:none;opacity:0}
.courtwrap{position:relative}
.banner.show{animation:ban 1s}
@keyframes ban{0%{opacity:0;transform:scale(.6)}20%{opacity:1;transform:scale(1.1)}80%{opacity:1}100%{opacity:0}}
.q{font-size:clamp(22px,5.5vw,26px);line-height:1.1;margin:0 0 12px;min-height:2.3em}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:center;text-align:left;width:100%;padding:11px 12px;border:3px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;font-size:22px;cursor:pointer;box-shadow:3px 3px 0 #000}
.opt kbd{font:9px var(--px);color:var(--orange);border:2px solid var(--orange);padding:5px 6px}
.opt:hover:not(:disabled),.opt:focus-visible{border-color:var(--orange);outline:none;box-shadow:3px 3px 0 #000,0 0 14px var(--orange)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--green);background:#0e2a1f;box-shadow:0 0 16px var(--green)}
.opt.bad{border-color:var(--pink);background:#2a0e1d;box-shadow:0 0 16px var(--pink)}
.end{text-align:center;padding:18px 8px}
.end h2{font:16px/1.5 var(--px);color:var(--gold);margin:0 0 12px}
.end p{margin:8px 0}
.big{font:30px var(--px);color:var(--cyan);text-shadow:0 0 12px var(--cyan)}
.btn{margin-top:14px;padding:14px 20px;border:3px solid var(--orange);background:var(--orange);color:#1a0d00;font:11px var(--px);cursor:pointer;box-shadow:4px 4px 0 #000}
.btn:focus-visible{outline:3px solid #fff;outline-offset:2px}
.hide{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<main>
  <h1>HOOPS TRIVIA</h1>
  <div class="hud">
    <div>Question<b id="qn">1/10</b></div>
    <div class="s">Score<b id="score">0</b></div>
    <div class="f">Streak<b id="streak">0</b></div>
    <div>Best<b id="best">0</b></div>
  </div>
  <div class="timer" id="bar"><i id="fill"></i></div>
  <div class="courtwrap">
    <div class="court">
      <svg viewBox="0 0 400 250" aria-label="Basketball hoop">
        <rect x="0" y="215" width="400" height="35" fill="#2a1608"/>
        <path d="M0 215H400" stroke="#ff8a2b" stroke-width="2" opacity=".6"/>
        <rect x="150" y="14" width="100" height="70" fill="#dfe8ee" fill-opacity=".14" stroke="#c5d0d5" stroke-width="3"/>
        <rect x="178" y="48" width="44" height="30" fill="none" stroke="#ff8a2b" stroke-width="2"/>
        <g id="rim"><ellipse cx="200" cy="100" rx="30" ry="7" fill="none" stroke="#ff8a2b" stroke-width="4"/></g>
        <circle id="ball" cx="110" cy="225" r="17" fill="#ff8a2b" stroke="#7a3300" stroke-width="2"/>
        <g id="ballL" stroke="#7a3300" stroke-width="2" fill="none"></g>
        <g class="net" id="net" stroke="#f3f7f8" stroke-width="1.5" opacity=".85">
          <path d="M172 102L184 140M186 105L192 142M200 107V143M214 105L208 142M228 102L216 140M178 120H222M184 134H216" fill="none"/>
        </g>
        <path d="M170 100Q200 118 230 100" fill="none" stroke="#ff8a2b" stroke-width="4"/>
      </svg>
    </div>
    <div class="banner" id="banner"></div>
  </div>
  <section id="play">
    <p class="q" id="q" aria-live="polite"></p>
    <div class="opts" id="opts"></div>
  </section>
  <section id="end" class="end hide"></section>
</main>
<script>
(function(){
  var BANK=[
    ["How many players from one team are on the court at a time?",["5","6","7","4"],0],
    ["Who scored 100 points in a single NBA game in 1962?",["Wilt Chamberlain","Bill Russell","Elgin Baylor","Oscar Robertson"],0],
    ["Which franchise is known as the Celtics?",["Boston","Chicago","Detroit","Miami"],0],
    ["How many points is a made shot from behind the arc worth?",["3","2","4","1"],0],
    ["What number did Michael Jordan wear for the Chicago Bulls?",["23","32","45","6"],0],
    ["Who passed Kareem Abdul-Jabbar as the NBA’s all-time leading scorer?",["LeBron James","Kobe Bryant","Karl Malone","Kevin Durant"],0],
    ["How high is a regulation basketball rim?",["10 feet","9 feet","11 feet","8 feet"],0],
    ["Who invented basketball in 1891?",["James Naismith","Phog Allen","John Wooden","Red Auerbach"],0],
    ["How long is the NBA shot clock?",["24 seconds","30 seconds","20 seconds","35 seconds"],0],
    ["Which player was nicknamed the “Black Mamba”?",["Kobe Bryant","Allen Iverson","Tracy McGrady","Dwyane Wade"],0],
    ["Who won 11 NBA championships as a player with the Celtics?",["Bill Russell","Larry Bird","Bob Cousy","Kevin McHale"],0],
    ["Stephen Curry spent his NBA career with which team?",["Golden State Warriors","Phoenix Suns","Houston Rockets","Sacramento Kings"],0],
    ["How many personal fouls cause a player to foul out in the NBA?",["6","5","7","4"],0],
    ["Magic Johnson spent his entire NBA career with which team?",["Los Angeles Lakers","Boston Celtics","New York Knicks","Detroit Pistons"],0],
    ["Who is the NBA’s all-time leader in career assists?",["John Stockton","Magic Johnson","Chris Paul","Jason Kidd"],0],
    ["In which city was the 1992 Olympic “Dream Team” competing?",["Barcelona","Seoul","Atlanta","Los Angeles"],0],
    ["How many points is a free throw worth?",["1","2","3","0.5"],0],
    ["Which team did LeBron James play for when he was drafted first overall in 2003?",["Cleveland Cavaliers","Miami Heat","Los Angeles Lakers","Chicago Bulls"],0]
  ];
  var ROUNDS=10,TIME=15000;
  var $=function(i){return document.getElementById(i);};
  var ball=$("ball"),net=$("net"),rim=$("rim");
  var order,idx,score,streak,right,best=0,busy,t0,tm,cur,locked;
  try{var b=parseInt(localStorage.getItem("hoops-best"),10);if(b>0)best=b;}catch(e){}

  function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
  function hud(){
    $("qn").textContent=Math.min(idx+1,ROUNDS)+"/"+ROUNDS;
    $("score").textContent=score;$("streak").textContent=streak;$("best").textContent=best;
  }
  function start(){
    order=shuffle(BANK).slice(0,ROUNDS);idx=0;score=0;streak=0;right=0;
    $("end").classList.add("hide");$("play").classList.remove("hide");
    resetBall();next();
  }
  function resetBall(){ball.setAttribute("cx",110);ball.setAttribute("cy",225);}
  function next(){
    if(idx>=ROUNDS)return finish();
    var item=order[idx];
    var opts=shuffle(item[1].map(function(t,i){return {t:t,c:i===item[2]};}));
    cur=opts;locked=false;
    $("q").textContent=item[0];
    var box=$("opts");box.innerHTML="";
    opts.forEach(function(o,i){
      var bt=document.createElement("button");bt.className="opt";bt.type="button";
      bt.innerHTML="<kbd>"+(i+1)+"</kbd><span></span>";bt.lastChild.textContent=o.t;
      bt.addEventListener("click",function(){answer(i);});
      box.appendChild(bt);
    });
    hud();
    t0=Date.now();clearInterval(tm);
    tm=setInterval(tick,100);tick();
  }
  function tick(){
    var left=Math.max(0,TIME-(Date.now()-t0));
    $("fill").style.width=(left/TIME*100)+"%";
    $("bar").classList.toggle("low",left<5000);
    if(left<=0&&!locked)answer(-1);
  }
  function answer(i){
    if(locked)return;locked=true;clearInterval(tm);
    var left=Math.max(0,TIME-(Date.now()-t0));
    var btns=$("opts").children,ok=i>=0&&cur[i].c;
    for(var k=0;k<btns.length;k++){
      btns[k].disabled=true;
      if(cur[k].c)btns[k].classList.add("ok");
    }
    if(i>=0&&!ok)btns[i].classList.add("bad");
    if(ok){
      streak++;right++;
      var pts=100+Math.floor(left/1000)*5+(streak>2?(streak-2)*25:0);
      score+=pts;
      shoot(true,function(){banner(streak>2?"ON FIRE +"+pts:"SWISH +"+pts,"#56e39f");setTimeout(advance,800);});
    }else{
      streak=0;
      shoot(false,function(){banner(i<0?"TIME!":"CLANK","#ff4fa3");setTimeout(advance,1000);});
    }
    hud();
  }
  function advance(){idx++;resetBall();next();}
  function banner(t,c){
    var b=$("banner");b.textContent=t;b.style.color=c;b.style.textShadow="0 0 10px "+c;
    b.classList.remove("show");void b.offsetWidth;b.classList.add("show");
  }
  function fly(p0,c,p1,ms,done){
    var s=Date.now();
    (function f(){
      var t=Math.min(1,(Date.now()-s)/ms),u=1-t;
      ball.setAttribute("cx",u*u*p0[0]+2*u*t*c[0]+t*t*p1[0]);
      ball.setAttribute("cy",u*u*p0[1]+2*u*t*c[1]+t*t*p1[1]);
      if(t<1)requestAnimationFrame(f);else done();
    })();
  }
  function shoot(made,done){
    var st=[110,225];
    if(made){
      fly(st,[135,-10],[200,98],800,function(){
        net.classList.remove("swish");void net.getBoundingClientRect();net.classList.add("swish");
        fly([200,98],[200,120],[200,200],350,done);
      });
    }else{
      fly(st,[150,0],[234,96],760,function(){
        rim.classList.remove("rimhit");void rim.getBoundingClientRect();rim.classList.add("rimhit");
        fly([234,96],[300,30],[330,205],600,done);
      });
    }
  }
  function finish(){
    clearInterval(tm);
    var nb=score>best;if(nb){best=score;try{localStorage.setItem("hoops-best",String(best));}catch(e){}}
    var g=right>=9?"MVP":right>=7?"ALL-STAR":right>=5?"STARTER":right>=3?"BENCH":"ROOKIE";
    $("play").classList.add("hide");
    var e=$("end");e.classList.remove("hide");
    e.innerHTML="<h2>FINAL BUZZER</h2><div class=\"big\">"+score+"</div><p>"+right+" of "+ROUNDS+" correct</p><p>Rank: <b style=\"color:var(--orange)\">"+g+"</b></p>"+(nb?"<p style=\"color:var(--green)\">New best score!</p>":"")+"<button class=\"btn\" id=\"again\">PLAY AGAIN</button>";
    $("again").addEventListener("click",start);$("again").focus();
    $("fill").style.width="0%";hud();
  }
  document.addEventListener("keydown",function(e){
    var n=parseInt(e.key,10);
    if(n>=1&&n<=4&&!locked&&!$("play").classList.contains("hide"))answer(n-1);
  });
  start();
})();
</script>
</body>
</html>
