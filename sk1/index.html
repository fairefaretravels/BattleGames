{const c=document.createElement('canvas');c.width=512;c.height=128;const x=c.getContext('2d');x.font='900 84px Impact,Arial Black';x.textAlign='center';x.fillStyle='#ff2aa0';x.shadowColor='#ff2aa0';x.shadowBlur=24;x.fillText('STREET KINGS',256,92);
 const m=new THREE.Mesh(new THREE.PlaneGeometry(14,3.5),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(c),transparent:true}));m.position.set(0,6,-13.5);S.add(m)}

 {n:'SHOCK STOMP',k:'Q',d:1,a:.5,b:.58,dmg:26,rng:4.3,stun:.7,kb:4,t:'KA-BOOM!'}];
const OPP=[{n:'BRUISER',col:0x3b82f6,skin:0xe0a070,sc:1.1,aggr:.45,react:.2,spd:3.6,dm:1,sps:1},
 {n:'VIPER',col:0x22c55e,skin:0xc98a5a,sc:.95,aggr:.6,react:.45,spd:5,dm:1,sps:2},
 {n:'MAD DOG',col:0xa855f7,skin:0xf0b88a,sc:1.2,aggr:.8,react:.65,spd:5.4,dm:1.15,sps:3}];
// --- fighter
const mat=c=>new THREE.MeshToonMaterial({color:c});
function pivotLimb(x,y,col,fist,len){const p=new THREE.Group();p.position.set(x,y,0);const m=new THREE.Mesh(new THREE.BoxGeometry(.42,len,.42),mat(col));m.position.y=-len/2;p.add(m);
 if(fist){const f=new THREE.Mesh(new THREE.SphereGeometry(.4,10,10),mat(fist));f.position.y=-len;p.add(f)}else{const f=new THREE.Mesh(new THREE.BoxGeometry(.55,.28,.8),mat(0x111111));f.position.set(0,-len,.15);p.add(f)}return p}
class F{constructor(col,skin,sc,spd,dm){this.g=new THREE.Group();this.g.rotation.order='YXZ';this.b=new THREE.Group();this.g.add(this.b);
 const t=new THREE.Mesh(new THREE.BoxGeometry(1.3,1.2,.8),mat(col));t.position.y=1.6;this.b.add(t);
 const h=new THREE.Mesh(new THREE.SphereGeometry(.62,14,12),mat(skin));h.position.y=2.75;this.b.add(h);
 const hb=new THREE.Mesh(new THREE.BoxGeometry(1.3,.2,1.3),mat(0xff3b5c));hb.position.y=2.95;this.b.add(hb);
 [-.22,.22].forEach(x=>{const e=new THREE.Mesh(new THREE.BoxGeometry(.14,.2,.1),mat(0));e.position.set(x,2.75,.58);this.b.add(e)});
 this.aL=pivotLimb(-.9,2,skin,skin,.9);this.aR=pivotLimb(.9,2,skin,skin,.9);this.b.add(this.aL,this.aR);
 this.lL=pivotLimb(-.35,1,0x222233,0,.8);this.lR=pivotLimb(.35,1,0x222233,0,.8);this.g.add(this.lL,this.lR);
 this.g.scale.setScalar(sc*.85);S.add(this.g);this.spd=spd;this.dm=dm;this.ph=rnd()*6;this.sp=0;this.reset(0,0)}
 reset(x,z){this.g.position.set(x,0,z);this.hp=100;this.meter=0;this.st='idle';this.t=0;this.kx=this.kz=0;this.win=false;this.d=5;this.fx=0;this.fz=-1;this.g.rotation.x=0}

 update(dt,inp,foe){this.t+=dt;const g=this.g,dx=foe.g.position.x-g.position.x,dz=foe.g.position.z-g.position.z,d=Math.hypot(dx,dz)||1,fx=dx/d,fz=dz/d;this.d=d;this.fx=fx;this.fz=fz;
  if(this.st!=='ko')g.rotation.y=Math.atan2(fx,fz);

   if(!this.done&&this.t>=m.a){if(m.proj){this.done=1;proj.push({x:g.position.x+fx*1.3,z:g.position.z+fz*1.3,dx:fx,dz:fz,l:1.6,o:this,m:fb()});}
    else{if(m.k==='Q'&&!this.ring){this.ring=1;for(let i=0;i<14;i++){const a=i/14*6.28;burst(g.position.x+Math.sin(a)*2.5,.3,g.position.z+Math.cos(a)*2.5,0xffd23f,1,3)}beep(70,.4,'sawtooth',.15)}
     if(this.t<=m.b&&d<m.rng){this.done=1;foe.hurt(m.dmg*this.dm,m.stun,m.kb,fx,fz,this,m.t)}}}
   if(m.lunge&&this.t<m.b&&d>1.5){g.position.x+=fx*m.lunge*dt;g.position.z+=fz*m.lunge*dt}
   if(this.t>=m.d)this.go('idle')}

   else{if(this.st==='block')this.go('idle');
    let key=null;if(inp.s&&this.meter>=COST)key='s';else if(inp.k)key='k';else if(inp.p)key='p';
    if(key){inp.eat(key);if(key==='s'){this.meter-=COST;this.mv=SP[this.sp]}else this.mv=MV[key];this.done=0;this.ring=0;this.go('atk');beep(key==='s'?300:200,.15);}

const proj=[],fbPool=[];function fb(){const m=new THREE.Mesh(new THREE.SphereGeometry(.55,10,10),new THREE.MeshBasicMaterial({color:0xff7a1a}));m.visible=true;S.add(m);return m}
// --- game
const P=new F(0xe0262f,0xf0b88a,1,5,1),E=new F(0x3b82f6,0xe0a070,1.1,3.6,1);

 if(w>=0){G.w[w]++;[P,E][w].win=true}else G.round--;banner(P.hp<=0||E.hp<=0?'K.O.!':w<0?'DRAW':'TIME!')}
function matchEnd(){G.st='menu';const win=G.w[0]>=2;let t=win?'YOU WIN! '+OPP[G.opp].n+' is down.':'YOU LOSE. '+OPP[G.opp].n+' wins.';
 if(win&&G.unlock<3){G.unlock++;try{localStorage.setItem('sk_unlock',G.unlock)}catch(e){}t+=' NEW SPECIAL UNLOCKED: '+SP[G.unlock-1].n+'!'}
 $('mtxt').textContent=t;$('go').textContent='REMATCH';$('nx').style.display=win?'':'none';$('menu').style.display='flex'}

$('go').onclick=()=>{beep(400,.1);startMatch()};$('nx').onclick=()=>{G.opp=(G.opp+1)%3;startMatch()};menuText();
// --- input
const keys={},buf={p:-9,k:-9,s:-9},held={b:false},stick={x:0,y:0};const now=()=>performance.now()/1000;

addEventListener('keydown',e=>{if(e.repeat)return;keys[e.code]=1;if(e.code==='KeyJ')buf.p=now();if(e.code==='KeyK')buf.k=now();if(e.code==='Space'){buf.s=now();e.preventDefault()}if(e.code==='KeyQ')swap()});
addEventListener('keyup',e=>keys[e.code]=0);
function pin(){let mx=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0)+stick.x,mz=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0)-stick.y,n=now();
 return{mx,mz,b:!!keys.KeyL||held.b,p:n-buf.p<.2,k:n-buf.k<.2,s:n-buf.s<.2,eat:x=>buf[x]=-9}}
const pad=$('pad'),kn=$('knob');let pid=null;
function pm(e){const r=pad.getBoundingClientRect();let x=e.clientX-r.left-65,y=e.clientY-r.top-65;const l=Math.hypot(x,y),mx=50;if(l>mx){x*=mx/l;y*=mx/l}kn.style.transform=`translate(${x}px,${y}px)`;stick.x=Math.abs(x)>8?x/mx:0;stick.y=Math.abs(y)>8?y/mx:0}
pad.addEventListener('pointerdown',e=>{pid=e.pointerId;pad.setPointerCapture(pid);pm(e)});pad.addEventListener('pointermove',e=>{if(e.pointerId===pid)pm(e)});
const pe=e=>{if(e.pointerId===pid){pid=null;stick.x=stick.y=0;kn.style.transform=''}};pad.addEventListener('pointerup',pe);pad.addEventListener('pointercancel',pe);
[['bP','p'],['bK','k'],['bS','s']].forEach(([id,k])=>$(id).addEventListener('pointerdown',e=>{buf[k]=now();e.target.classList.add('on')}));
['bP','bK','bS'].forEach(id=>['pointerup','pointercancel'].forEach(v=>$(id).addEventListener(v,e=>e.target.classList.remove('on'))));
$('bB').addEventListener('pointerdown',e=>{held.b=true;e.target.classList.add('on')});['pointerup','pointercancel'].forEach(v=>$('bB').addEventListener(v,e=>{held.b=false;e.target.classList.remove('on')}));
$('bW').addEventListener('pointerdown',swap);addEventListener('contextmenu',e=>e.preventDefault());
// --- AI
const AI={t:0,a:{mx:0,mz:0,b:false,p:false,k:false,s:false,eat(k){this[k]=false}},
 get(f,foe,dt,o){const a=this.a,d=f.d;this.t-=dt;if(this.t>0)return a;
  a.mx=a.mz=0;a.b=a.p=a.k=a.s=false;const r=rnd();
  if(foe.st==='atk'&&d<3.6&&r<o.react){a.b=true;this.t=.45}
  else if(d>3.4){a.mz=1;a.mx=rnd()-.5;this.t=.25+rnd()*.3;if(f.meter>=COST&&rnd()<.35&&d>4.2){f.sp=Math.floor(rnd()*o.sps);a.s=true}}
  else{const q=rnd();if(q<o.aggr){if(f.meter>=COST&&rnd()<.3){f.sp=Math.floor(rnd()*o.sps);a.s=true}else if(d>2.5||rnd()<.4)a.k=true;else a.p=true;this.t=.35+rnd()*.35}
   else if(q<.75){a.mx=rnd()<.5?1:-1;this.t=.4}else if(q<.9){a.mz=-1;this.t=.4}else{a.b=true;this.t=.5}}
  return a}};
const none={mx:0,mz:0,b:false,p:false,k:false,s:false,eat(){}};
// --- loop
let last=performance.now(),T=0;const cp=new V3(),cl=new V3(),tp=new V3(),tl=new V3();
function frame(){requestAnimationFrame(frame);const n=performance.now();let dt=Math.min((n-last)/1000,.05);last=n;T+=dt;
 if(G.hs>0){G.hs-=dt;dt=0}
 G.shake=Math.max(0,G.shake-dt*1.5);
 let pi=none,ei=none;
 if(G.st==='intro'){G.t-=dt;if(G.t<=0){G.st='fight';banner('FIGHT!')}}
 else if(G.st==='fight'){pi=pin();ei=AI.get(E,P,dt,OPP[G.opp]);G.timer-=dt;if(G.timer<=0){G.timer=0;endRound()}}
 else if(G.st==='roundend'){G.t-=dt;if(G.t<=0){if(G.w[0]>=2||G.w[1]>=2)matchEnd();else{G.round++;startRound()}}}
 P.update(dt,pi,E);E.update(dt,ei,P);
 const dx=E.g.position.x-P.g.position.x,dz=E.g.position.z-P.g.position.z,dd=Math.hypot(dx,dz);
 if(dd<1.5&&dd>0){const k=(1.5-dd)/2/dd;P.g.position.x-=dx*k;P.g.position.z-=dz*k;E.g.position.x+=dx*k;E.g.position.z+=dz*k}
 for(let i=proj.length-1;i>=0;i--){const q=proj[i],f=q.o===P?E:P;q.x+=q.dx*10*dt;q.z+=q.dz*10*dt;q.l-=dt;q.m.position.set(q.x,1.8,q.z);q.m.scale.setScalar(1+Math.sin(T*30)*.2);
  const hit=Math.hypot(f.g.position.x-q.x,f.g.position.z-q.z)<1.1&&G.st==='fight';
  if(hit)f.hurt(SP[0].dmg*q.o.dm,SP[0].stun,SP[0].kb,q.dx,q.dz,q.o,SP[0].t);
  if(hit||q.l<=0){S.remove(q.m);proj.splice(i,1)}}
 sp.forEach(s=>{if(s.l>0){s.l-=dt;s.m.position.addScaledVector(s.v,dt);s.v.y-=18*dt;s.m.scale.setScalar(Math.max(s.l/.45,.01));if(s.l<=0)s.m.visible=false}});
 P.pose(T);E.pose(T);
 // camera: over-the-shoulder third person behind player, looking at the foe
 if(G.st==='menu'){const a=T*.3;tp.set(Math.sin(a)*9,3.5,Math.cos(a)*9);tl.set(0,1.8,0)}
 else{const fx=P.fx,fz=P.fz,dist=4.8+dd*.35;
  tp.set(P.g.position.x-fx*dist-fz*1.3,3.2+dd*.12,P.g.position.z-fz*dist+fx*1.3);
  tl.set(P.g.position.x+dx*.55,1.7,P.g.position.z+dz*.55)}
 const k=1-Math.exp(-7*Math.min((n-last+16)/1000,.05));cp.lerp(tp,k);cl.lerp(tl,k);
 cam.position.copy(cp).add(new V3((rnd()-.5)*G.shake,(rnd()-.5)*G.shake,(rnd()-.5)*G.shake));cam.lookAt(cl);
 // HUD
 $('h1').style.width=P.hp+'%';$('h2').style.width=E.hp+'%';$('timer').textContent=Math.ceil(G.timer);
 $('p1').textContent='●'.repeat(G.w[0])+'○'.repeat(2-G.w[0]);$('p2').textContent='●'.repeat(G.w[1])+'○'.repeat(2-G.w[1]);
 $('mt').style.width=P.meter+'%';$('mtw').className='mt'+(P.meter>=COST?' ready':'');$('spn').textContent='SP: '+SP[P.sp].n;
 R.render(S,cam)}
cp.set(0,4,12);cl.set(0,2,0);P.reset(0,3.6);E.reset(0,-3.6);setOpp();frame();
</script></body></html>
