<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">

<style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id),V3=THREE.Vector3,rnd=Math.random;
const R=new THREE.WebGLRenderer({antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));document.body.prepend(R.domElement);
const S=new THREE.Scene();S.background=new THREE.Color(0x140a2a);S.fog=new THREE.Fog(0x140a2a,14,42);
const cam=new THREE.PerspectiveCamera(60,1,.1,100);
function rs(){R.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.fov=cam.aspect<1?80:60;cam.updateProjectionMatrix();
 $('ctrl').style.display=(matchMedia('(pointer:coarse)').matches||innerWidth<800)?'block':'none'}
addEventListener('resize',rs);rs();
S.add(new THREE.HemisphereLight(0x9aa8ff,0x331a33,1));
const dl=new THREE.DirectionalLight(0xffffff,.9);dl.position.set(5,12,6);S.add(dl);
[[0xff2aa0,-8,5,-6],[0x20d0ff,8,5,6]].forEach(c=>{const l=new THREE.PointLight(c[0],1.4,30);l.position.set(c[1],c[2],c[3]);S.add(l)});
// --- arena
const ground=new THREE.Mesh(new THREE.CircleGeometry(40,48),new THREE.MeshLambertMaterial({color:0x2b2b38}));ground.rotation.x=-Math.PI/2;S.add(ground);
const ring=new THREE.Mesh(new THREE.RingGeometry(6.9,7.2,48),new THREE.MeshBasicMaterial({color:0xffd23f}));ring.rotation.x=-Math.PI/2;ring.position.y=.02;S.add(ring);
const wc=document.createElement('canvas');wc.width=64;wc.height=128;{const x=wc.getContext('2d');x.fillStyle='#181828';x.fillRect(0,0,64,128);
 for(let i=0;i<8;i++)for(let j=0;j<16;j++){x.fillStyle=rnd()<.45?(rnd()<.5?'#ffd77a':'#7fd8ff'):'#242438';x.fillRect(i*8+1,j*8+1,5,5)}}
const wt=new THREE.CanvasTexture(wc);
for(let i=0;i<16;i++){const a=i/16*Math.PI*2,r=17+rnd()*3,h=8+rnd()*12;
 const b=new THREE.Mesh(new THREE.BoxGeometry(6,h,6),new THREE.MeshLambertMaterial({map:wt}));b.position.set(Math.sin(a)*r,h/2,Math.cos(a)*r);b.rotation.y=a;S.add(b)}
for(let i=0;i<7;i++){const a=i*.9+.3,c=new THREE.Mesh(new THREE.CylinderGeometry(.5,.5,1.2,10),new THREE.MeshLambertMaterial({color:i%2?0x884422:0x336655}));c.position.set(Math.sin(a)*9,.6,Math.cos(a)*9);S.add(c)}
{const c=document.createElement('canvas');c.width=512;c.height=128;const x=c.getContext('2d');x.font='900 84px Impact,Arial Black';x.textAlign='center';x.fillStyle='#ff2aa0';x.shadowColor='#ff2aa0';x.shadowBlur=24;x.fillText('STREET KINGS',256,92);
 const m=new THREE.Mesh(new THREE.PlaneGeometry(14,3.5),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(c),transparent:true}));m.position.set(0,6,-13.5);S.add(m)}
// --- sparks
const sp=[];for(let i=0;i<48;i++){const m=new THREE.Mesh(new THREE.SphereGeometry(.13,6,6),new THREE.MeshBasicMaterial({color:0xfff}));m.visible=false;S.add(m);sp.push({m,v:new V3,l:0})}
function burst(x,y,z,col,n,sc=9){for(let i=0;i<n;i++){const s=sp.find(q=>q.l<=0);if(!s)return;s.l=.45;s.m.visible=true;s.m.material.color.setHex(col);s.m.position.set(x,y,z);s.v.set(rnd()-.5,rnd()*.8,rnd()-.5).multiplyScalar(sc)}}
// --- audio
let AC;function beep(f,d,ty='square',v=.08){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.value=f;o.frequency.exponentialRampToValueAtTime(f*.4,AC.currentTime+d);g.gain.value=v;g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
// --- moves
const COST=50;
const MV={p:{k:'P',d:.34,a:.1,b:.22,dmg:7,rng:2.5,stun:.26,kb:.8,t:'POW!'},k:{k:'K',d:.55,a:.2,b:.34,dmg:12,rng:2.9,stun:.4,kb:2,t:'WHAM!'}};
const SP=[{n:'FLAME FIST',k:'F',d:.75,a:.3,b:.34,proj:1,dmg:16,stun:.5,kb:2.5,t:'BOOM!'},
 {n:'METEOR HOOK',k:'H',d:.7,a:.15,b:.55,dmg:22,rng:2.8,stun:.6,kb:3.5,lunge:11,t:'SMASH!'},
 {n:'SHOCK STOMP',k:'Q',d:1,a:.5,b:.58,dmg:26,rng:4.3,stun:.7,kb:4,t:'KA-BOOM!'}];
const OPP=[{n:'BRUISER',col:0x3b82f6,skin:0xe0a070,sc:1.1,aggr:.45,react:.2,spd:3.6,dm:1,sps:1},
 {n:'VIPER',col:0x22c55e,skin:0xc98a5a,sc:.95,aggr:.6,react:.45,spd:5,dm:1,sps:2},
 {n:'MAD DOG',col:0xa855f7,skin:0xf0b88a,sc:1.2,aggr:.8,react:.65,spd:5.4,dm:1.15,sps:3}];

/* =========================================================
   STREET KINGS — SPRITE SHEET FIGHTERS
   Sprite folder: ./sprites/ (next to this HTML file)
   Each action sheet: 5 columns x 5 rows = 25 frames
   ========================================================= */

const SK_SPRITE_ROOT = './sprites/';

const SK_CHARACTERS = {
  Gontor: {
    prefix: 'Gontor',
    actions: [
      'idle', 'walk', 'run', 'jump', 'punch', 'kick',
      'block', 'crouch', 'hit_react', 'fall', 'death',
      'dodge_lean', 'roll', 'slide', 'dance', 'talk',
      'victory', 'fly'
    ]
  },
  Klondor: {
    prefix: 'KLONDOR',
    actions: [
      'idle', 'walk', 'run', 'dash', 'jump', 'punch',
      'kick', 'block', 'crouch', 'hit_react', 'fall',
      'death', 'dodge_lean', 'roll', 'slide', 'push',
      'shoot', 'talk', 'dance', 'victory'
    ]
  },
  Root: {
    prefix: 'ROOT',
    actions: [
      'idle', 'walk', 'run', 'jump', 'punch', 'kick',
      'block', 'crouch', 'hit_react', 'fall', 'death',
      'roll', 'slide', 'talk', 'dance',
      'asm_sword_quick_strike', 'asm_sword_triple_combo'
    ]
  }
};

const SK_SHEETS = {};

function skLoadSheet(character, action) {
  const definition = SK_CHARACTERS[character];
  if (!definition || !definition.actions.includes(action)) return null;

  const key = character + ':' + action;
  if (SK_SHEETS[key]) return SK_SHEETS[key];

  const image = new Image();
  const texture = new THREE.Texture(image);

  texture.generateMipmaps = false;
  texture.minFilter = THREE.LinearFilter;
  texture.magFilter = THREE.NearestFilter;
  texture.wrapS = THREE.ClampToEdgeWrapping;
  texture.wrapT = THREE.ClampToEdgeWrapping;

  const filename = definition.prefix + '-' + action + '.png';
  const sheet = { image, texture, ready: false };

  image.onload = () => {
    sheet.ready = true;
    texture.needsUpdate = true;
  };
  image.onerror = () => {
    console.warn('STREET KINGS sprite not found:', SK_SPRITE_ROOT + filename);
  };
  image.src = SK_SPRITE_ROOT + filename;

  SK_SHEETS[key] = sheet;
  return sheet;
}

function skAvailable(character, action) {
  return !!(SK_CHARACTERS[character] && SK_CHARACTERS[character].actions.includes(action));
}

// Preload the sheets the game actually uses so animations don't pop in blank.
Object.keys(SK_CHARACTERS).forEach(c =>
  ['idle','walk','punch','kick','block','hit_react','death','fall','victory']
    .forEach(a => skLoadSheet(c, a)));

class F {
  constructor(col, skin, sc, spd, dm, character) {
    this.character = character || 'Gontor';
    this.g = new THREE.Group();

    this.tex = new THREE.Texture();

    this.spr = new THREE.Mesh(
      new THREE.PlaneGeometry(3.2, 3.2),
      new THREE.MeshBasicMaterial({
        map: this.tex,
        transparent: true,
        alphaTest: 0.04,
        side: THREE.DoubleSide,
        color: 0xffffff
      })
    );
    this.spr.position.set(0, 1.6, 0);
    this.g.add(this.spr);

    const shadow = new THREE.Mesh(
      new THREE.CircleGeometry(1.05, 20),
      new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.4 })
    );
    shadow.rotation.x = -Math.PI / 2;
    shadow.position.y = 0.03;
    this.g.add(shadow);

    this.g.scale.setScalar(sc * 0.85);
    S.add(this.g);

    this.spd = spd;
    this.dm = dm;
    this.ph = rnd() * 6;
    this.sp = 0;
    this.dir = 1;

    this.animAction = '';
    this.animFrame = -1;

    this.setCharacter(this.character);
    this.reset(0, 0);
  }

  setCharacter(character) {
    if (!SK_CHARACTERS[character]) return;
    this.character = character;
    this.animAction = '';
    this.animFrame = -1;
    this.setAnimation('idle');
  }

  setAnimation(action) {
    if (!skAvailable(this.character, action)) action = 'idle';
    if (this.animAction === action) return;

    this.animAction = action;
    this.animFrame = -1;

    const sheet = skLoadSheet(this.character, action);
    if (sheet) {
      this.tex = sheet.texture;
      this.spr.material.map = this.tex;
      this.spr.material.needsUpdate = true;
    }
  }

  fr(i) {
    const sheet = SK_SHEETS[this.character + ':' + this.animAction];
    if (!sheet || !sheet.ready) return;

    const frame = Math.max(0, Math.min(24, i | 0));
    const col = frame % 5;
    const row = Math.floor(frame / 5);

    // Frame zero is the top-left cell. Only the UV transform changes,
    // so there is no need to re-upload the texture every frame.
    this.tex.repeat.set(0.2, 0.2);
    this.tex.offset.set(col * 0.2, 1 - (row + 1) * 0.2);

    this.animFrame = frame;
  }

  reset(x, z) {
    this.g.position.set(x, 0, z);
    this.hp = 100;
    this.meter = 0;
    this.st = 'idle';
    this.t = 0;
    this.kx = this.kz = 0;
    this.win = false;
    this.d = 5;
    this.fx = 0;
    this.fz = -1;
    this.g.rotation.x = 0;
    this.setAnimation('idle');
  }

  go(s) { this.st = s; this.t = 0; }

  update(dt, inp, foe) {
    this.t += dt;

    const g = this.g;
    const dx = foe.g.position.x - g.position.x;
    const dz = foe.g.position.z - g.position.z;
    const d = Math.hypot(dx, dz) || 1;
    const fx = dx / d;
    const fz = dz / d;

    this.d = d;
    this.fx = fx;
    this.fz = fz;

    if (this.st !== 'ko') this.dir = fx >= 0 ? 1 : -1;

    g.position.x += this.kx * dt;
    g.position.z += this.kz * dt;

    const dc = Math.exp(-6 * dt);
    this.kx *= dc;
    this.kz *= dc;

    if (this.st === 'ko') {
      // Remain down until the next round.
    } else if (this.st === 'hit') {
      if (this.t >= this.stun) this.go('idle');
    } else if (this.st === 'atk') {
      const m = this.mv;

      if (!this.done && this.t >= m.a) {
        if (m.proj) {
          this.done = 1;
          proj.push({
            x: g.position.x + fx * 1.3,
            z: g.position.z + fz * 1.3,
            dx: fx, dz: fz, l: 1.6, o: this, m: fb()
          });
        } else {
          if (m.k === 'Q' && !this.ring) {
            this.ring = 1;
            for (let i = 0; i < 14; i++) {
              const a = i / 14 * 6.28;
              burst(g.position.x + Math.sin(a) * 2.5, 0.3, g.position.z + Math.cos(a) * 2.5, 0xffd23f, 1, 3);
            }
            beep(70, 0.4, 'sawtooth', 0.15);
          }

          if (this.t <= m.b && d < m.rng) {
            this.done = 1;
            foe.hurt(m.dmg * this.dm, m.stun, m.kb, fx, fz, this, m.t);
          }
        }
      }

      if (m.lunge && this.t < m.b && d > 1.5) {
        g.position.x += fx * m.lunge * dt;
        g.position.z += fz * m.lunge * dt;
      }

      if (this.t >= m.d) this.go('idle');
    } else {
      if (inp.b) {
        if (this.st !== 'block') this.go('block');
      } else {
        if (this.st === 'block') this.go('idle');

        let key = null;
        if (inp.s && this.meter >= COST) key = 's';
        else if (inp.k) key = 'k';
        else if (inp.p) key = 'p';

        if (key) {
          inp.eat(key);

          if (key === 's') {
            this.meter -= COST;
            this.mv = SP[this.sp];
          } else {
            this.mv = MV[key];
          }

          this.done = 0;
          this.ring = 0;
          this.go('atk');
          beep(key === 's' ? 300 : 200, 0.15);
        } else {
          const mz = inp.mz;
          const l = Math.abs(mz);

          if (l > 0.15) {
            const k = Math.min(l, 1) / l;
            g.position.x += fx * mz * k * this.spd * dt;
            g.position.z += fz * mz * k * this.spd * dt;
            if (this.st !== 'walk') this.go('walk');
          } else if (this.st === 'walk') {
            this.go('idle');
          }
        }
      }
    }

    const r = Math.hypot(g.position.x, g.position.z);
    if (r > 6.8) {
      g.position.x *= 6.8 / r;
      g.position.z *= 6.8 / r;
    }
  }

  hurt(dmg, stun, kb, fx, fz, by, txt) {
    if (this.st === 'ko' || G.st !== 'fight') return;

    const blk = this.st === 'block';
    let col = 0xffe45c;

    if (blk) {
      dmg *= 0.12;
      kb *= 0.5;
      col = 0x66aaff;
      txt = 'BLOCK';
    } else {
      this.go('hit');
      this.stun = stun;
    }

    this.hp = Math.max(0, this.hp - dmg);
    this.kx = fx * kb * 4;
    this.kz = fz * kb * 4;

    this.meter = Math.min(100, this.meter + dmg * 0.6);
    if (by) by.meter = Math.min(100, by.meter + dmg * 0.9);

    const p = this.g.position;
    burst(p.x, 1.8, p.z, col, blk ? 5 : 12);
    beep(blk ? 150 : 110, 0.12, 'sawtooth', 0.12);

    G.hs = blk ? 0.03 : 0.08;
    G.shake = blk ? 0.1 : 0.3;
    pop(txt);

    if (this.hp <= 0) {
      this.go('ko');
      endRound();
    }
  }

  pose(T) {
    let action = 'idle';
    let frame = 0;

    if (this.st === 'ko') {
      action = skAvailable(this.character, 'death') ? 'death' : 'fall';
      frame = Math.min(24, Math.floor(this.t * 6));
    } else if (this.st === 'hit') {
      action = 'hit_react';
      frame = Math.min(24, Math.floor(this.t * 12));
    } else if (this.st === 'block') {
      action = 'block';
      frame = Math.floor(this.t * 6) % 25;
    } else if (this.st === 'walk') {
      action = 'walk';
      frame = Math.floor(T * 12 + this.ph) % 25;
    } else if (this.st === 'atk') {
      const m = this.mv;
      const p = Math.min(1, this.t / m.d);

      if (m.k === 'K' || m.k === 'Q') action = 'kick';
      else action = 'punch';

      if (!skAvailable(this.character, action)) action = 'kick';
      frame = Math.min(24, Math.floor(p * 25));
    } else if (this.win) {
      action = 'victory';
      frame = Math.floor(T * 8) % 25;
    } else {
      frame = Math.floor(T * 7 + this.ph) % 25;
    }

    this.setAnimation(action);
    this.fr(frame);

    // Keep the fighters facing one another.
    this.spr.scale.x = this.dir < 0 ? -1 : 1;
  }
}

<script>
/* Independent radio controls.
   Does not touch the game's fighting or input logic. */
(() => {
  const audio = document.getElementById('skRadioAudio');
  const toggle = document.getElementById('skRadioToggle');
  const volume = document.getElementById('skRadioVolume');
  const status = document.getElementById('skRadioStatus');

  if (!audio || !toggle || !volume || !status) return;

  audio.volume = Number(volume.value);

  volume.addEventListener('input', () => {
    audio.volume = Number(volume.value);
  });
  // Release focus so game keys (Space, arrows) don't keep poking the radio controls.
  volume.addEventListener('change', () => volume.blur());

  toggle.addEventListener('click', async () => {
    toggle.blur();

    if (!audio.paused) {
      audio.pause();
      return;
    }

    status.textContent = 'Connecting to station…';
    toggle.disabled = true;

    try {
      await audio.play();
      status.textContent = 'LIVE — playing Mackinthedark Radio';
    } catch (error) {
      status.textContent = 'Could not start. Tap PLAY to retry or check your connection.';
    } finally {
      toggle.disabled = false;
    }
  });

  audio.addEventListener('playing', () => {
    toggle.textContent = 'Ⅱ PAUSE';
    toggle.setAttribute('aria-pressed', 'true');
    status.textContent = 'LIVE — playing Mackinthedark Radio';
  });

  audio.addEventListener('pause', () => {
    toggle.textContent = '▶ PLAY';
    toggle.setAttribute('aria-pressed', 'false');
    if (!audio.ended) status.textContent = 'Radio paused';
  });

  audio.addEventListener('waiting', () => {
    status.textContent = 'Buffering live stream…';
  });

  audio.addEventListener('error', () => {
    status.textContent = 'Stream unavailable right now. Tap PLAY to retry later.';
  });
})();
</script>
