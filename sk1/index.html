<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>STREET KINGS 2D</title>
<style>
:root{--bg:#0b0b14;--fg:#fff;--gold:#ffd23f;--red:#ff3b5c;--cy:#35e0ff;box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Impact,'Arial Black',sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%}
#hud{position:fixed;left:0;right:0;top:0;display:flex;align-items:flex-start;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 8px) 10px 0;pointer-events:none}
.bar{flex:1}.bar.r{text-align:right}
.name{font-size:14px;letter-spacing:1px;text-shadow:0 2px 0 #000}
.hp{height:16px;background:#000a;border:2px solid #fff;transform:skew(-14deg);overflow:hidden}
.hp i{display:block;height:100%;width:100%;background:linear-gradient(#ffe45c,#ff8a00);transition:width .15s}
.r .hp i{margin-left:auto;background:linear-gradient(#ff7b8e,#e0123a)}
.pips{font-size:14px;color:var(--gold);letter-spacing:3px}
#timer{font-size:30px;width:54px;text-align:center;text-shadow:0 3px 0 #000;margin-top:4px}
#mw{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 70px);text-align:center;font-size:11px;letter-spacing:1px;pointer-events:none;width:46%;max-width:260px}
.mt{height:8px;border:1px solid #fff;background:#000a;margin-top:2px}.mt i{display:block;height:100%;width:0;background:var(--cy)}
.mt.ready i{background:var(--gold);box-shadow:0 0 10px var(--gold)}
#banner,#pop{position:fixed;left:0;right:0;text-align:center;pointer-events:none;text-shadow:0 4px 0 #000,0 0 20px #000}
#banner{top:34%;font-size:min(14vw,90px);color:var(--gold);opacity:0}
#pop{top:24%;font-size:min(9vw,44px);color:#fff;opacity:0}
.show{animation:pp 1s ease-out forwards}
@keyframes pp{0%{transform:scale(2.2);opacity:0}15%{transform:scale(1);opacity:1}80%{opacity:1}100%{opacity:0}}
#menu{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:#0009;text-align:center;padding:16px;z-index:5}
#menu h1{margin:0;font-size:min(15vw,84px);color:var(--gold);text-shadow:4px 4px 0 var(--red);transform:skew(-6deg);line-height:.95}
#menu p{margin:0;font:600 13px/1.4 system-ui,sans-serif;max-width:420px;color:#ddd}
.btn{font:inherit;font-size:22px;background:var(--red);color:#fff;border:3px solid #fff;padding:10px 26px;transform:skew(-8deg);cursor:pointer}
.btn.alt{background:#2a2a4a}
#ctrl{position:fixed;inset:auto 0 0 0;height:190px;pointer-events:none;display:none;padding-bottom:env(safe-area-inset-bottom,0px)}
#pad{position:absolute;left:18px;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);width:130px;height:130px;border-radius:50%;background:#fff2;border:2px solid #fff6;pointer-events:auto;touch-action:none}
#knob{position:absolute;left:35px;top:35px;width:60px;height:60px;border-radius:50%;background:#fffa}
.ab{position:absolute;border-radius:50%;border:3px solid #fff;color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center;pointer-events:auto;touch-action:none;background:#0007}
.ab.on{background:var(--red)}
#bP{right:88px;bottom:calc(env(safe-area-inset-bottom,0px) + 28px);width:74px;height:74px}
#bK{right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 60px);width:74px;height:74px}
#bB{right:150px;bottom:calc(env(safe-area-inset-bottom,0px) + 90px);width:58px;height:58px;background:#2a4a8a99}
#bS{right:62px;bottom:calc(env(safe-area-inset-bottom,0px) + 118px);width:66px;height:66px;background:#b8860b99}
#bW{right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 140px);width:40px;height:40px;font-size:10px}
</style></head><body>
<div id="hud"><div class="bar"><div class="name" id="n1">REX</div><div class="hp"><i id="h1"></i></div><div class="pips" id="p1"></div></div>
<div id="timer">60</div>
<div class="bar r"><div class="name" id="n2">BRUISER</div><div class="hp"><i id="h2"></i></div><div class="pips" id="p2"></div></div></div>
<div id="mw"><span id="spn"></span><div class="mt" id="mtw"><i id="mt"></i></div></div>
<div id="banner"></div><div id="pop"></div>
<div id="menu"><h1>STREET<br>KINGS</h1><p id="mtxt"></p><button class="btn" id="go">START FIGHT</button><button class="btn alt" id="nx" style="display:none">NEXT FIGHTER</button>
<p>Keys: A/D (or arrows) move · J punch · K kick · L block · Space special · Q swap special<br>Touch: stick left/right + PUNCH / KICK / BLOCK / SP / swap</p></div>
<div id="ctrl"><div id="pad"><div id="knob"></div></div>

function pm(e){const r=pad.getBoundingClientRect();let x=e.clientX-r.left-65,y=e.clientY-r.top-65;const l=Math.hypot(x,y),mx=50;if(l>mx){x*=mx/l;y*=mx/l}kn.style.transform=`translate(${x}px,${y}px)`;stick.x=Math.abs(x)>8?x/mx:0;stick.y=Math.abs(y)>8?y/mx:0}
pad.addEventListener('pointerdown',e=>{pid=e.pointerId;pad.setPointerCapture(pid);pm(e)});pad.addEventListener('pointermove',e=>{if(e.pointerId===pid)pm(e)});
const pe=e=>{if(e.pointerId===pid){pid=null;stick.x=stick.y=0;kn.style.transform=''}};pad.addEventListener('pointerup',pe);pad.addEventListener('pointercancel',pe);
[['bP','p'],['bK','k'],['bS','s']].forEach(([id,k])=>$(id).addEventListener('pointerdown',e=>{buf[k]=now();e.target.classList.add('on')}));
['bP','bK','bS'].forEach(id=>['pointerup','pointercancel'].forEach(v=>$(id).addEventListener(v,e=>e.target.classList.remove('on'))));
$('bB').addEventListener('pointerdown',e=>{held.b=true;e.target.classList.add('on')});['pointerup','pointercancel'].forEach(v=>$('bB').addEventListener(v,e=>{held.b=false;e.target.classList.remove('on')}));
$('bW').addEventListener('pointerdown',swap);addEventListener('contextmenu',e=>e.preventDefault());
// --- AI
const AI={t:0,a:{mx:0,mz:0,b:false,p:false,k:false,s:false,eat(k){this[k]=false}},
 get(f,foe,dt,o){const a=this.a,d=f.d;this.t-=dt;if(this.t>0)return a;
  a.mx=a.mz=0;a.b=a.p=a.k=a.s=false;const r=rnd();
  if(foe.st==='atk'&&d<3.6&&r<o.react){a.b=true;this.t=.45}
  else if(d>3.4){a.mz=1;a.mx=rnd()-.5;this.t=.25+rnd()*.3;if(f.meter>=COST&&rnd()<.35&&d>4.2){f.sp=Math.floor(rnd()*o.sps);a.s=true}}
  else{const q=rnd();if(q<o.aggr){if(f.meter>=COST&&rnd()<.3){f.sp=Math.floor(rnd()*o.sps);a.s=true}else if(d>2.5||rnd()<.4)a.k=true;else a.p=true;this.t=.35+rnd()*.35}
   else if(q<.75){a.mz=rnd()<.5?1:-1;this.t=.4}else if(q<.9){a.mz=-1;this.t=.4}else{a.b=true;this.t=.5}}
  return a}};
const none={mx:0,mz:0,b:false,p:false,k:false,s:false,eat(){}};
// --- loop
let last=performance.now(),T=0;const cp=new V3(),cl=new V3(),tp=new V3(),tl=new V3();
function frame(){requestAnimationFrame(frame);const n=performance.now();let dt=Math.min((n-last)/1000,.05);last=n;T+=dt;
 if(G.hs>0){G.hs-=dt;dt=0}
 G.shake=Math.max(0,G.shake-dt*1.5);
 let pi=none,ei=none;
 if(G.st==='intro'){G.t-=dt;if(G.t<=0){G.st='fight';banner('FIGHT!')}}
 else if(G.st==='fight'){pi=pin();ei=AI.get(E,P,dt,OPP[G.opp]);G.timer-=dt;if(G.timer<=0){G.timer=0;endRound()}}
 else if(G.st==='roundend'){G.t-=dt;if(G.t<=0){if(G.w[0]>=2||G.w[1]>=2)matchEnd();else{G.round++;startRound()}}}
 P.update(dt,pi,E);E.update(dt,ei,P);
 const dx=E.g.position.x-P.g.position.x,dz=E.g.position.z-P.g.position.z,dd=Math.hypot(dx,dz);
 if(dd<1.5&&dd>0){const k=(1.5-dd)/2/dd;P.g.position.x-=dx*k;P.g.position.z-=dz*k;E.g.position.x+=dx*k;E.g.position.z+=dz*k}
 for(let i=proj.length-1;i>=0;i--){const q=proj[i],f=q.o===P?E:P;q.x+=q.dx*10*dt;q.z+=q.dz*10*dt;q.l-=dt;q.m.position.set(q.x,1.8,q.z);q.m.scale.setScalar(1+Math.sin(T*30)*.2);
  const hit=Math.hypot(f.g.position.x-q.x,f.g.position.z-q.z)<1.1&&G.st==='fight';
  if(hit)f.hurt(SP[0].dmg*q.o.dm,SP[0].stun,SP[0].kb,q.dx,q.dz,q.o,SP[0].t);
  if(hit||q.l<=0){S.remove(q.m);proj.splice(i,1)}}
 sp.forEach(s=>{if(s.l>0){s.l-=dt;s.m.position.addScaledVector(s.v,dt);s.v.y-=18*dt;s.m.scale.setScalar(Math.max(s.l/.45,.01));if(s.l<=0)s.m.visible=false}});
 P.pose(T);E.pose(T);
 // camera: over-the-shoulder third person behind player, looking at the foe
 const mid=(P.g.position.x+E.g.position.x)/2,zc=Math.max(7.5,(dd/2+3.5)/(Math.tan(cam.fov*Math.PI/360)*cam.aspect));tp.set(mid,2.8+zc*.08,zc);tl.set(mid,2.2,0);
 const k=1-Math.exp(-7*Math.min((n-last+16)/1000,.05));cp.lerp(tp,k);cl.lerp(tl,k);
 cam.position.copy(cp).add(new V3((rnd()-.5)*G.shake,(rnd()-.5)*G.shake,(rnd()-.5)*G.shake));cam.lookAt(cl);
 // HUD
 $('h1').style.width=P.hp+'%';$('h2').style.width=E.hp+'%';$('timer').textContent=Math.ceil(G.timer);
 $('p1').textContent='●'.repeat(G.w[0])+'○'.repeat(2-G.w[0]);$('p2').textContent='●'.repeat(G.w[1])+'○'.repeat(2-G.w[1]);
 $('mt').style.width=P.meter+'%';$('mtw').className='mt'+(P.meter>=COST?' ready':'');$('spn').textContent='SP: '+SP[P.sp].n;
 R.render(S,cam)}
cp.set(0,4,12);cl.set(0,2,0);P.reset(-3,0);E.reset(3,0);setOpp();frame();
