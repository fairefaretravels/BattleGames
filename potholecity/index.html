P.x+=(st*(5+P.v*.08)+(P.fl[1]-P.fl[0])*.9)*dt*mv;

for(const o of obs){if(o.t=='t')o.z+=o.v*dt;const dz=o.z-P.z,dx=Math.abs(o.x-P.x);

if(o.t=='c'&&!o.got&&Math.abs(dz)<1.3&&dx<.9){o.got=1;coins++;sc+=25}}
obs=obs.filter(o=>o.z>P.z-12&&!o.got);

if(P.z>=L.len){sc+=500;S='clear';show(clearUI())}}

[-1,1].forEach((s,i)=>{x.fillStyle=fl[i]?'#5a1414':'#0d0d0d';const q=fl[i]?13:25;x.fillRect(s*46-9,-q,18,q);if(fl[i]&&d.v>2){x.fillStyle='#ffb030';for(let k=0;k<4;k++)x.fillRect(s*46+(Math.random()-.5)*24,-Math.random()*8,3,3)}});
x.rotate(d?(fl[1]-fl[0])*.04:0);
x.fillStyle=col;x.fillRect(-50,-56,100,36);x.beginPath();x.moveTo(-38,-56);x.lineTo(-30,-84);x.lineTo(30,-84);x.lineTo(38,-56);x.fill();

function truck(cx,by,w,t){const u=w/100;x.save();x.translate(cx,by);x.scale(u,u);
x.fillStyle='#444';x.fillRect(-90,-40,100,20);x.fillStyle='#e8b800';x.fillRect(10,-70,70,50);x.fillStyle='#0b1822';x.fillRect(48,-62,26,20);

function draw(t){const L=LV[lvl],hy=H*(.36-.07*camT),F=Math.min(W*.95,H*.55),camH=2.6+3.4*camT,camZ=P.z-(4+5*camT),camX=P.x*.6+look*2.2;

const q=(a,b,c,d,f)=>{x.fillStyle=f;x.beginPath();x.moveTo(a[0],a[1]);x.lineTo(b[0],b[1]);x.lineTo(c[0],c[1]);x.lineTo(d[0],d[1]);x.fill()};
const sp=(xa,xb,z0,z1,f)=>q(pj(xa,z0),pj(xb,z0),pj(xb,z1),pj(xa,z1),f);

x.fillStyle='#17191e';x.fillRect(-20,hy,W+40,H);

const b0=Math.floor(camZ/4);
for(let i=62;i>=0;i--){const k=b0+i,z0=Math.max(k*4,camZ+.5),z1=k*4+4;if(z1<=z0)continue;
sp(-R-2.4,R+2.4,z0,z1,'#444650');sp(-R,R,z0,z1,k%2?'#2c2f36':'#33363e');sp(-R-.3,-R,z0,z1,k%2?'#c33':'#ddd');sp(R,R+.3,z0,z1,k%2?'#c33':'#ddd');

for(let i=16;i>=1;i--){const n=bi+i,z=n*16;if(z<camZ+1)continue;

for(let rw=0;rw*2.4+3<Hh;rw++)for(let cc=0;cc<3;cc++){const p=pj(xi+sd*(.9+cc*1.9),z,2+rw*2.4),sz=p[2];x.fillStyle=h(n*31+rw*7+cc+sd)>.55?'#ffd27a':'#1a1d26';x.fillRect(p[0],p[1],sz*sd,-sz*1.2)}
if(n%6==0){const p1=pj(xi+sd*.4,z,3.2),p2=pj(xo-sd*.4,z,3.9),ww=Math.abs(p2[0]-p1[0]),hh=Math.abs(p1[1]-p2[1]);x.fillStyle='#ff2a4a';x.fillRect(Math.min(p1[0],p2[0]),Math.min(p1[1],p2[1]),ww,hh);

const lb=pj(sd*(R+.5),z+8),lt=pj(sd*(R+.5),z+8,4.2);x.strokeStyle='#222';x.lineWidth=Math.max(1,lb[2]*.1);x.beginPath();x.moveTo(lb[0],lb[1]);x.lineTo(lt[0],lt[1]);x.stroke();

g=x.createLinearGradient(0,hy-H*.03,0,hy+H*.12);g.addColorStop(0,'rgba(122,58,106,0)');g.addColorStop(.3,'rgba(122,58,106,.85)');g.addColorStop(1,'rgba(122,58,106,0)');x.fillStyle=g;x.fillRect(-20,hy-H*.03,W+40,H*.15);
const li=obs.filter(o=>o.z>camZ+.6&&o.z<camZ+240);li.push({t:'me',z:P.z,x:P.x});if(L.len>camZ&&L.len<camZ+240)li.push({t:'f',z:L.len});

else if(o.t=='c'){const c=pj(o.x,o.z,.7+.1*Math.sin(t*5+o.z)),w=Math.abs(Math.cos(t*3+o.z))*.3*s+1;x.fillStyle='#ffd23c';x.beginPath();x.ellipse(c[0],c[1],w,.3*s,0,0,7);x.fill();x.strokeStyle='#b8860b';x.lineWidth=2;x.stroke()}
else if(o.t=='t')car(p[0],p[1],s*1.05,o.c,null,t);

else{cp=pj(P.x,P.z);const by=cp[1]-Math.sin(P.bn*8)*P.bn*10*cp[2]/60;car(cp[0],by,cp[2]*1.05,'#2c3b3a',{fl:P.fl,bump:P.bump,hp:P.hp,v:P.v},t)}}
if(S=='tow'){x.fillStyle='rgba(0,0,0,.4)';x.fillRect(-20,-20,W+40,H+40);const e=Math.min(1,tow.t/1.5);truck(cp[0]-cp[2]*1.7-(1-e)*W,cp[1],cp[2]*1.5,t);
x.fillStyle='#fff';x.textAlign='center';x.font=`bold ${Math.min(W,H*.62)/400*26}px Impact,sans-serif`;x.fillText('TOW TRUCK EN ROUTE… '+Math.ceil(tow.d-tow.t)+'s',W/2,H*.3);x.font=`${Math.min(W,H*.62)/400*15}px system-ui`;x.fillText('Gameplay frozen · fee '+tow.fee+'🪙',W/2,H*.3+26)}
