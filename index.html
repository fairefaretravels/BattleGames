<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>BATTLEGROUND ARCADE</title>
  <meta name="description" content="Enter the FIGHT. Choose your battleground, unleash your power, and challenge your rivals.">
  <meta name="author" content="Saneca Mack">
  <meta name="theme-color" content="#111719">
  <meta property="og:type" content="website">
  <meta property="og:title" content="BATTLEGROUND">
  <meta property="og:description" content="Enter the arena. Choose your battleground. Battle your rivals.">
  <meta property="og:image" content="https://fairefaretravels.github.io/BattleGames/sk1/got.jpg">
  <meta property="og:url" content="https://fairefaretravels.github.io/BattleGames/">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="BATTLEGROUND">
  <meta name="twitter:description" content="Choose your battleground and enter the fight.">
  <meta name="twitter:image" content="https://fairefaretravels.github.io/BattleGames/sk1/got.jpg">
  <style>
    :root {
      --green: #56e39f;
      --cyan: #42e8f5;
      --purple: #a878ff;
      --brown: #79533e;
      --silver: #c5d0d5;
      --gold: #ffd166;
      --bg: #0b1012;
      --panel: #151d20;
      --panel-light: #202a2d;
      --text: #f3f7f8;
      --muted: #a4b2b7;
      --border: #354448;
    }
    * {
      box-sizing: border-box;
    }
    html {
      min-height: 100%;
      background: var(--bg);
    }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      padding: 28px 18px;
      display: grid;
      place-items: center;
      overflow-x: hidden;
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      background:
  linear-gradient(
    rgba(11, 16, 18, 0.62),
    rgba(11, 16, 18, 0.82)
  ),
  url("./Industrial.jpg") center center / cover no-repeat fixed;
}
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.16;
      background-image:
        linear-gradient(rgba(197, 208, 213, 0.09) 1px, transparent 1px),
        linear-gradient(90deg, rgba(197, 208, 213, 0.09) 1px, transparent 1px);
      background-size: 36px 36px;
      mask-image: linear-gradient(to bottom, black, transparent 90%);
    }
    main {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 500px;
      text-align: center;
    }
    .topline {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin-bottom: 22px;
      color: var(--silver);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 4px;
      text-transform: uppercase;
    }
    .status-light {
      width: 8px;
      height: 8px;
      flex: 0 0 8px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 12px rgba(86, 227, 159, 0.8);
    }
    .emblem {
      width: 72px;
      height: 72px;
      margin: 0 auto 18px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(197, 208, 213, 0.45);
      border-radius: 22px 7px 22px 7px;
      background:
        linear-gradient(145deg,
          rgba(86, 227, 159, 0.16),
          rgba(66, 232, 245, 0.06) 45%,
          rgba(168, 120, 255, 0.18));
      box-shadow:
        inset 0 0 22px rgba(66, 232, 245, 0.06),
        0 0 30px rgba(66, 232, 245, 0.08);
      transform: rotate(-3deg);
    }
    .emblem span {
      color: var(--gold);
      font-size: 35px;
      font-weight: 1000;
      font-style: italic;
      text-shadow: 2px 2px 0 var(--brown);
      transform: rotate(3deg);
    }
    h1 {
      margin: 0;
      font-size: clamp(39px, 10vw, 61px);
      line-height: 0.94;
      font-weight: 1000;
      font-style: italic;
      letter-spacing: -2.5px;
      text-transform: uppercase;
      text-shadow:
        2px 2px 0 var(--brown),
        4px 4px 0 rgba(0, 0, 0, 0.65);
    }
    h1 .garden {
      display: block;
      color: var(--green);
    }
    h1 .terror {
      display: block;
      margin-top: 5px;
      color: var(--silver);
      text-shadow:
        2px 2px 0 var(--purple),
        4px 4px 0 rgba(0, 0, 0, 0.7);
    }
    .subtitle {
      max-width: 340px;
      margin: 22px auto 28px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.9;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .subtitle strong {
      color: var(--gold);
      font-weight: 800;
    }
    .divider {
      width: 100%;
      height: 1px;
      margin: 0 auto 20px;
      background: linear-gradient(
        90deg,
        transparent,
        var(--green),
        var(--cyan),
        var(--purple),
        var(--gold),
        transparent
      );
      opacity: 0.8;
    }
    .select-label {
      margin: 0 0 12px;
      color: var(--silver);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 3px;
      text-transform: uppercase;
    }
    nav {
      display: grid;
      gap: 12px;
    }
    .fight-button {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      min-height: 82px;
      padding: 17px 18px;
      overflow: hidden;
      border: 1px solid var(--border);
      border-left: 4px solid var(--green);
      border-radius: 8px;
      color: var(--text);
      background: linear-gradient(110deg, #1b2628, #12191d 80%);
      text-decoration: none;
      text-align: left;
      transition:
        transform 180ms ease,
        border-color 180ms ease,
        background 180ms ease,
        box-shadow 180ms ease;
    }
    .fight-button::after {
      content: "";
      position: absolute;
      top: 0;
      right: 0;
      width: 85px;
      height: 100%;
      pointer-events: none;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(66, 232, 245, 0.045)
      );
    }
    .fight-button.second {
      border-left-color: var(--purple);
      background: linear-gradient(110deg, #211c2b, #15191e 80%);
    }
    .button-copy {
      position: relative;
      z-index: 1;
      min-width: 0;
    }
    .button-title {
      display: block;
      color: var(--silver);
      font-size: clamp(15px, 4vw, 18px);
      font-weight: 900;
      letter-spacing: 0.8px;
    }
    .button-description {
      display: block;
      margin-top: 7px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
    }
    .button-number {
      display: block;
      margin-bottom: 4px;
      color: var(--green);
      font-size: 9px;
      font-weight: 900;
      letter-spacing: 2px;
    }
    .second .button-number {
      color: var(--purple);
    }
    .arrow {
      position: relative;
      z-index: 1;
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      flex: 0 0 38px;
      border: 1px solid rgba(197, 208, 213, 0.24);
      border-radius: 6px;
      color: var(--gold);
      font-size: 23px;
      transition: transform 180ms ease, background 180ms ease;
    }
    .fight-button:hover,
    .fight-button:focus-visible {
      transform: translateY(-3px);
      border-color: var(--cyan);
      background: linear-gradient(110deg, #213432, #172126);
      box-shadow: 0 8px 24px rgba(66, 232, 245, 0.09);
      outline: 2px solid transparent;
    }
    .fight-button.second:hover,
    .fight-button.second:focus-visible {
      border-color: var(--purple);
      background: linear-gradient(110deg, #30243d, #191d24);
      box-shadow: 0 8px 24px rgba(168, 120, 255, 0.12);
    }
    .fight-button:hover .arrow,
    .fight-button:focus-visible .arrow {
      transform: translateX(3px);
      background: rgba(255, 209, 102, 0.1);
    }
    .palette {
      display: flex;
      justify-content: center;
      gap: 7px;
      margin: 24px 0 0;
    }
    .palette span {
      width: 23px;
      height: 4px;
      border-radius: 10px;
    }
    .green { background: var(--green); }
    .cyan { background: var(--cyan); }
    .purple { background: var(--purple); }
    .brown { background: var(--brown); }
    .silver { background: var(--silver); }
    .gold { background: var(--gold); }
    footer {
      margin-top: 23px;
      color: #819096;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 2px;
      line-height: 1.8;
      text-transform: uppercase;
    }
    footer span {
      color: var(--gold);
    }
    @media (max-width: 380px) {
      body {
        padding: 24px 14px;
      }
      .topline {
        letter-spacing: 3px;
      }
      .fight-button {
        min-height: 76px;
        padding: 14px;
      }
      .button-description {
        font-size: 11px;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="topline">
      <span class="status-light" aria-hidden="true"></span>
      SENSTACK PRESENTS
    </div>
    <div class="emblem" aria-hidden="true">
      <span>G</span>
    </div>
    <h1>
      <span class="garden">GARDEN OF</span>
      <span class="terror">TERROR</span>
    </h1>
    <p class="subtitle">
      Enter the arena.<br>
      <strong>Choose your battleground.</strong><br>
      Prove your power.
    </p>
    <div class="divider" aria-hidden="true"></div>
    <p class="select-label">Select your game</p>
    <nav aria-label="Game selection">
      <a class="fight-button" href="./sk1/" aria-label="Play Garden of Terror">
        <span class="button-copy">
          <span class="button-number">ARENA 01</span>
          <span class="button-title">GARDEN OF TERROR</span>
          <span class="button-description">Enter the first arena</span>
        </span>
        <span class="arrow" aria-hidden="true">→</span>
      </a>
      <a class="fight-button second" href="./sk2/" aria-label="Play Street Kings II">
        <span class="button-copy">
          <span class="button-number">ARENA 02</span>
          <span class="button-title">STREET KINGS II</span>
          <span class="button-description">Take the battle to the streets</span>
        </span>
        <span class="arrow" aria-hidden="true">→</span>
      </a>
    </nav>
    <div class="palette" aria-hidden="true">
      <span class="green"></span>
      <span class="cyan"></span>
      <span class="purple"></span>
      <span class="brown"></span>
      <span class="silver"></span>
      <span class="gold"></span>
    </div>
    <footer>
      BATTLEGROUND <span>·</span> SENSTACK<br>
      Choose wisely. Fight fiercely.
    </footer>
  </main>
</body>
</html>
