<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0f1e">
<title>GET HOME! — The Great Bridge Adventure</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#0b0f1e;color:#fff;font-family:"Trebuchet MS","Avenir Next",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;touch-action:manipulation;user-select:none;-webkit-user-select:none}
#game{position:fixed;inset:0}
canvas#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font-family:inherit;color:inherit}
.hidden{display:none!important}

/* HUD */
#hud{position:absolute;top:0;left:0;right:0;display:flex;gap:6px;align-items:flex-start;padding:max(8px,env(safe-area-inset-top)) 8px 4px;pointer-events:none;z-index:5}
.pcard{flex:1;min-width:0;display:flex;align-items:center;gap:7px;padding:6px 9px;border-radius:14px;background:linear-gradient(180deg,rgba(14,18,48,.92),rgba(8,10,30,.92));border:2px solid var(--pc);box-shadow:0 0 0 rgba(0,0,0,0);transition:box-shadow .3s,transform .3s;position:relative}
.pcard.active{box-shadow:0 0 18px var(--pc),inset 0 0 12px rgba(255,255,255,.12);transform:translateY(1px) scale(1.03)}
.pcard.active::after{content:"YOUR TURN";position:absolute;left:50%;bottom:-9px;transform:translateX(-50%);font-size:9px;font-weight:900;letter-spacing:.08em;background:var(--pc);color:#fff;padding:1px 7px;border-radius:8px;white-space:nowrap}
#pc0{--pc:#3aa0ff}#pc1{--pc:#b657ff}
.pcard svg{width:24px;height:30px;flex:none;filter:drop-shadow(0 0 4px var(--pc))}
.pinfo{min-width:0;line-height:1.15}
.pinfo b{display:block;font-size:12px;font-weight:900;letter-spacing:.04em;white-space:nowrap}
.pinfo span{font-size:13px;font-weight:800;color:#ffe27a;white-space:nowrap}
.pinfo span u{text-decoration:none;color:#fff;opacity:.8;margin-left:6px}
#lvlchip{pointer-events:auto;flex:none;border:2px solid #ffcf5a;background:linear-gradient(180deg,#3b2410,#1d1208);border-radius:14px;padding:5px 9px;text-align:center;cursor:pointer;line-height:1.1;box-shadow:0 0 12px rgba(255,190,60,.35)}
#lvlchip small{display:block;font-size:9px;font-weight:900;letter-spacing:.1em;color:#ffcf5a}
#lvlchip b{font-size:13px;font-weight:900;white-space:nowrap}

/* Bottom controls */
#bottom{position:absolute;left:0;right:0;bottom:0;padding:26px 10px max(10px,env(safe-area-inset-bottom));background:linear-gradient(to top,rgba(5,6,22,.92) 55%,rgba(5,6,22,0));z-index:5;display:flex;flex-direction:column;gap:6px;align-items:center}
#msg{min-height:34px;max-width:560px;text-align:center;font-size:14px;font-weight:800;line-height:1.25;text-shadow:0 2px 6px #000;padding:0 4px;display:flex;align-items:center;justify-content:center}
#msg.warn{color:#ff9a9a}#msg.good{color:#9dffb4}
#ctrls{display:flex;gap:8px;align-items:center;justify-content:center;width:100%;max-width:560px}
.btn{border:0;border-radius:14px;padding:11px 14px;font-weight:900;font-size:15px;cursor:pointer;transition:transform .12s,filter .2s,opacity .2s;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:active{transform:scale(.95)}
.btn[disabled]{opacity:.45;filter:grayscale(.6);cursor:default}
.pri{background:linear-gradient(180deg,#5dff7c,#16a640);color:#05220f;box-shadow:0 4px 0 #0b6a27,0 0 18px rgba(80,255,120,.45);flex:1;font-size:20px;letter-spacing:.06em;padding:13px 10px}
.gold{background:linear-gradient(180deg,#ffe27a,#f0a010);color:#3a2200;box-shadow:0 4px 0 #a86a00}
.sec{background:linear-gradient(180deg,#2c3366,#161a3c);border:2px solid rgba(255,255,255,.22);padding:8px 10px;font-size:20px;flex-direction:column;gap:0;line-height:1;min-width:64px}
.sec span{font-size:10px;font-weight:800;letter-spacing:.03em}
.pri.pulse:not([disabled]){animation:pulse 1.1s infinite}
@keyframes pulse{50%{transform:scale(1.05);filter:brightness(1.15)}}

/* Dice */
#dice{width:62px;height:62px;flex:none;border-radius:15px;background:linear-gradient(145deg,#6dff8a,#17a944 60%,#0d6d2c);box-shadow:inset -4px -5px 8px rgba(0,0,0,.35),inset 3px 3px 6px rgba(255,255,255,.5),0 5px 0 #0a4d1e,0 0 16px rgba(80,255,130,.4);display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:9px;cursor:pointer;position:relative}
#dice i{border-radius:50%;margin:auto;width:78%;height:78%;background:transparent}
#dice i.on{background:radial-gradient(circle at 35% 30%,#fff,#e6ffe9 60%,#9fd6ad);box-shadow:0 1px 2px rgba(0,0,0,.5)}
#dice.rolling{animation:tumble .45s linear infinite}
@keyframes tumble{0%{transform:rotate(0) translateY(0) scale(1)}25%{transform:rotate(100deg) translateY(-14px) scale(1.12)}50%{transform:rotate(200deg) translateY(0) scale(1)}75%{transform:rotate(290deg) translateY(-10px) scale(1.1)}100%{transform:rotate(360deg) translateY(0) scale(1)}}
#dice.land{animation:land .35s ease-out}
@keyframes land{0%{transform:scale(1.35) rotate(-12deg)}60%{transform:scale(.94)}100%{transform:scale(1)}}

/* Screens / modals */
.screen{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:14px;background:rgba(4,5,20,.62);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
#modalBox{width:100%;max-width:460px;max-height:88vh;overflow:auto;background:linear-gradient(180deg,#2d1d52,#150d2e);border:3px solid #ffcf5a;border-radius:20px;padding:18px 16px;box-shadow:0 0 40px rgba(255,200,80,.35),0 20px 50px rgba(0,0,0,.6);animation:pop .3s ease-out}
@keyframes pop{0%{transform:scale(.8);opacity:0}100%{transform:scale(1);opacity:1}}
#modalBox h2{margin:0 0 8px;text-align:center;font-size:22px;font-weight:900;color:#ffe27a;letter-spacing:.03em}
#modalBox p{margin:6px 0;font-size:14.5px;line-height:1.4;color:#efeaff}
#modalBox .row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
#modalBox .row .btn{flex:1;min-width:120px}
.legend{display:grid;grid-template-columns:34px 1fr;gap:6px 10px;align-items:center;margin:8px 0}
.sw{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:900;box-shadow:inset 0 -3px 0 rgba(0,0,0,.3),0 0 8px rgba(255,255,255,.2)}
.legend div:nth-child(even){font-size:13.5px;line-height:1.25}
.bigcard{text-align:center;padding:6px}
.bigcard .em{font-size:64px;line-height:1;filter:drop-shadow(0 4px 8px rgba(0,0,0,.5))}
.bigcard h3{margin:6px 0 4px;font-size:22px;color:#ffe27a;font-weight:900;letter-spacing:.05em;text-transform:uppercase}
.bigcard .fx{display:inline-block;margin-top:6px;padding:5px 14px;border-radius:12px;font-weight:900;font-size:16px;background:#000a;border:2px solid currentColor}
.lvgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:8px}
.lvbtn{border:2px solid rgba(255,255,255,.3);border-radius:14px;padding:10px 6px;text-align:center;cursor:pointer;font-weight:900;font-size:14px;background:var(--bg);position:relative;overflow:hidden;min-height:78px;text-shadow:0 2px 4px #000;transition:transform .12s}
.lvbtn:active{transform:scale(.96)}
.lvbtn .e{font-size:30px;display:block;line-height:1.1}
.lvbtn small{display:block;font-size:10.5px;font-weight:700;opacity:.9;margin-top:2px;line-height:1.2}
.lvbtn.sel{border-color:#ffe27a;box-shadow:0 0 16px #ffd24a}
.lvbtn.done::after{content:"✔";position:absolute;top:4px;right:7px;color:#9dffb4}

/* Title */
#title{background:radial-gradient(ellipse at 50% 30%,rgba(60,20,110,.35),rgba(4,5,20,.82));flex-direction:column;gap:8px;text-align:center;overflow:auto}
.logo{font-size:clamp(50px,15vw,104px);line-height:.88;font-weight:900;font-style:italic;letter-spacing:-.02em;background:linear-gradient(180deg,#fff 10%,#b8c8ff 45%,#8a5cff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 #1a0a5a) drop-shadow(0 0 22px rgba(130,90,255,.9));transform:skew(-4deg);animation:float 3s ease-in-out infinite}
.logo span{display:block;font-size:1.18em}
@keyframes float{50%{transform:skew(-4deg) translateY(-6px)}}
.tag{font-size:clamp(15px,4.2vw,22px);font-weight:900;font-style:italic;color:#e8dcff;text-shadow:0 2px 8px #000}
.sub{font-size:12px;font-weight:800;letter-spacing:.2em;color:#ffcf5a;text-transform:uppercase}
#title .lvgrid{width:100%;max-width:440px;grid-template-columns:repeat(4,1fr);gap:7px}
#title .lvbtn{min-height:84px;padding:8px 2px;font-size:12px}
#title .lvbtn small{display:none}
#title .btn.pri{flex:none;font-size:22px;padding:15px 32px;margin-top:6px}
@media (max-height:640px){.logo{font-size:clamp(40px,11vw,70px)}#title{gap:5px}}
@media (orientation:landscape) and (max-height:540px){
  #hud{padding-top:max(6px,env(safe-area-inset-top))}
  #bottom{left:auto;top:58px;width:156px;padding:6px 8px 8px;background:linear-gradient(to left,rgba(5,6,22,.88) 70%,rgba(5,6,22,0));justify-content:center;align-items:center}
  #ctrls{flex-direction:column;gap:6px}
  #ctrls .btn{width:100%}
  #ctrls .sec{flex-direction:row;gap:6px;min-width:0;font-size:16px;padding:7px 10px}
  #ctrls .sec span{font-size:11px}
  #msg{font-size:12px;min-height:44px}
  #dice{width:54px;height:54px}
}
</style>
</head>
<body>
<div id="game">
  <canvas id="c"></canvas>

  <div id="hud">
    <div class="pcard" id="pc0">
      <svg viewBox="0 0 24 30"><defs><linearGradient id="g0" x1="0" x2="1"><stop offset="0" stop-color="#8fd0ff"/><stop offset="1" stop-color="#1766d1"/></linearGradient></defs><ellipse cx="12" cy="26" rx="10" ry="4" fill="url(#g0)"/><path d="M5 26 Q9 22 10 12 L14 12 Q15 22 19 26Z" fill="url(#g0)"/><circle cx="12" cy="8" r="6" fill="url(#g0)"/></svg>
      <div class="pinfo"><b>PLAYER 1</b><span>⭐ <i id="st0" style="font-style:normal">0</i><u>🏆 <i id="wn0" style="font-style:normal">0</i></u></span></div>
    </div>
    <button id="lvlchip" aria-label="Choose level"><small id="lvnum">LEVEL 1</small><b id="lvname">City Life</b></button>
    <div class="pcard" id="pc1">
      <svg viewBox="0 0 24 30"><defs><linearGradient id="g1" x1="0" x2="1"><stop offset="0" stop-color="#e2b0ff"/><stop offset="1" stop-color="#6d1fc7"/></linearGradient></defs><ellipse cx="12" cy="26" rx="10" ry="4" fill="url(#g1)"/><path d="M5 26 Q9 22 10 12 L14 12 Q15 22 19 26Z" fill="url(#g1)"/><circle cx="12" cy="8" r="6" fill="url(#g1)"/></svg>
      <div class="pinfo"><b>PLAYER 2</b><span>⭐ <i id="st1" style="font-style:normal">0</i><u>🏆 <i id="wn1" style="font-style:normal">0</i></u></span></div>
    </div>
  </div>

  <div id="bottom">
    <div id="msg">Welcome!</div>
    <div id="ctrls">
      <button id="btnNew" class="btn sec" aria-label="New Game">↺<span>New Game</span></button>
      <div id="dice" role="button" aria-label="Roll the dice" tabindex="0"></div>
      <button id="btnRoll" class="btn pri pulse">ROLL</button>
      <button id="btnMenu" class="btn sec" aria-label="Menu">☰<span>Menu</span></button>
    </div>
  </div>

  <div id="title" class="screen">
    <div class="sub">The Great Bridge Adventure</div>
    <div class="logo">GET<span>HOME!</span></div>
    <div class="tag">Roll. Move. Survive.</div>
    <div class="sub" style="margin-top:6px">Pick your adventure</div>
    <div class="lvgrid" id="titleLevels"></div>
    <button id="btnStart" class="btn pri">▶ START ADVENTURE</button>
    <button id="btnHow" class="btn sec" style="flex-direction:row;gap:8px;font-size:14px;min-width:0;padding:9px 18px">❓ How to Play</button>
  </div>

  <div id="modal" class="screen hidden"><div id="modalBox"></div></div>
</div>

<script>
(()=>{
'use strict';
/* ================= helpers ================= */
const $=s=>document.querySelector(s);
const cv=$('#c'), ctx=cv.getContext('2d');
const skyC=document.createElement('canvas'), fgC=document.createElement('canvas');
const TAU=Math.PI*2;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), lerp=(a,b,t)=>a+(b-a)*t;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rgba=(c,a)=>`rgba(${c[0]},${c[1]},${c[2]},${a})`;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const CANCEL={};

/* ================= level data ================= */
const GOAL=29;
const LEVELS=[
{name:'City Life',emoji:'🏙️',blurb:'Neon rooftops & rush-hour chaos',bg:'linear-gradient(135deg,#ff7a59,#5a1f8c)',
 per:14.5,A:3,sgn:1,A2:0,per2:1,deck:[28,38,34],rail:'#e2bd86',
 sp:{F:[3,12,21],B:[7,18,25],Q:[5,10,15,20,26],S:[9,23],C:[13],T:[2,8,16,22,27]},ropes:[[4,11],[17,24]],
 cards:[
 {t:'Taxi Ride',e:'🚕',x:'A cab driver knows a shortcut!',mv:3},
 {t:'Subway Delay',e:'🚇',x:'Your train is stuck between stations.',mv:-2},
 {t:'Street Performer',e:'🎷',x:'You tip the sax player and catch two lucky stars!',st:2},
 {t:'Movie Night',e:'🎟️',x:'You pulled up to the movies but got called into work!',mv:-2},
 {t:'Helicopter Lift',e:'🚁',x:'A friendly pilot gives you a lift!',mv:4},
 {t:'Rush Hour',e:'🚦',x:'Gridlock! You lose your next turn.',skip:1},
 {t:'Food Truck',e:'🌮',x:'Free tacos give you energy. Roll again!',again:1},
 {t:'Banana Peel',e:'🍌',x:'Your rival slipped! They go back 2 spaces.',opp:-2},
 {t:'Neon Flip',e:'🔄',x:'The signs flip! Swap places with your rival!',swap:1}]},
{name:'Forest Trail',emoji:'🌲',blurb:'Misty pines & rushing rivers',bg:'linear-gradient(135deg,#6be08a,#0d4a3a)',
 per:11.6,A:3.1,sgn:-1,A2:0,per2:1,deck:[30,34,30],rail:'#c9a064',
 sp:{F:[2,11,19,26],B:[6,14,24],Q:[4,9,16,21,27],S:[8,18],C:[12,23],T:[3,7,13,20,25]},ropes:[[5,10],[15,22]],
 cards:[
 {t:'Wise Owl',e:'🦉',x:'A wise owl points out the quickest way!',mv:3},
 {t:'Muddy Path',e:'🥾',x:'Your boots get stuck in the mud.',mv:-2},
 {t:'Berry Bush',e:'🫐',x:'Sweet berries! You find two stars.',st:2},
 {t:'Bear Encounter',e:'🐻',x:'A bear! You tiptoe back 3 spaces.',mv:-3},
 {t:'Squirrel Express',e:'🐿️',x:'Hop on! The squirrels zip you ahead.',mv:4},
 {t:'Thick Fog',e:'🌫️',x:'You can\'t see a thing. Lose your next turn.',skip:1},
 {t:'Campfire',e:'🔥',x:'Toasty! You feel energized. Roll again!',again:1},
 {t:'Fallen Log',e:'🪵',x:'Your rival trips over a log. Back 2 spaces!',opp:-2},
 {t:'Fairy Portal',e:'✨',x:'Sparkles! Swap places with your rival!',swap:1}]},
{name:'Desert Run',emoji:'🏜️',blurb:'Canyon crossings & dangerous paths',bg:'linear-gradient(135deg,#ffb347,#9c2a1e)',
 per:19.3,A:3.2,sgn:1,A2:0,per2:1,deck:[26,40,40],rail:'#e9c08a',
 sp:{F:[3,13,20],B:[5,9,16,22,27],Q:[4,11,18,25],S:[7,14,23],C:[10,19],T:[2,8,15,21,26]},ropes:[[6,12],[17,24]],
 cards:[
 {t:'Camel Caravan',e:'🐪',x:'Hitch a ride on a friendly camel!',mv:3},
 {t:'Sandstorm',e:'🌪️',x:'Blown back 3 spaces!',mv:-3},
 {t:'Oasis',e:'🌴',x:'Cool water and two shiny stars!',st:2},
 {t:'Scorpion!',e:'🦂',x:'Yikes! You scramble back 2 spaces.',mv:-2},
 {t:'Hot Air Balloon',e:'🎈',x:'Up, up and away! Forward 4.',mv:4},
 {t:'Heat Stroke',e:'☀️',x:'Too hot! Rest and lose your next turn.',skip:1},
 {t:'Cactus Juice',e:'🌵',x:'Refreshing! Roll again!',again:1},
 {t:'Tumbleweed',e:'🌾',x:'A tumbleweed bowls your rival back 2!',opp:-2},
 {t:'Mirage',e:'🌅',x:'Is that real? Swap places with your rival!',swap:1}]},
{name:'Sky Island',emoji:'🏰',blurb:'Floating bridges & a castle in the clouds',bg:'linear-gradient(135deg,#8f7bff,#1c1a6b)',
 per:14.5,A:3,sgn:-1,A2:.6,per2:9.667,deck:[34,42,52],rail:'#f0d9a0',
 sp:{F:[4,10,17,24],B:[3,8,14,21,26,28],Q:[5,11,18,22,27],S:[7,15,25],C:[9,19],T:[2,6,13,20,23]},ropes:[[12,16]],
 cards:[
 {t:'Pegasus',e:'🦄',x:'A winged horse carries you ahead!',mv:4},
 {t:'Storm Cloud',e:'⛈️',x:'Zap! You get blown back 3 spaces.',mv:-3},
 {t:'Star Shower',e:'🌠',x:'Wishes come true! Two bonus stars.',st:2},
 {t:'Gust of Wind',e:'💨',x:'Whoosh! Back 2 spaces.',mv:-2},
 {t:'Rainbow Slide',e:'🌈',x:'Wheee! Slide forward 3 spaces.',mv:3},
 {t:'Cloud Nap',e:'😴',x:'So fluffy... you doze off. Lose a turn.',skip:1},
 {t:'Golden Feather',e:'🪶',x:'A lucky feather! Roll again!',again:1},
 {t:'Cloud Prank',e:'☁️',x:'A cloud dumps rain on your rival. Back 3!',opp:-3},
 {t:'Portal Swap',e:'🌀',x:'A portal opens! Swap places!',swap:1}]}
];
LEVELS.forEach(L=>{
  const a=Array(30).fill('.');a[0]='start';a[GOAL]='home';
  for(const k in L.sp)L.sp[k].forEach(i=>a[i]=k);
  L.ropes.forEach(([s,e])=>{a[s]='R';a[e]='r'});
  L.types=a;
});
const TC={'.':['#f1dcae','#b99560'],F:['#55f07a','#12963a'],B:['#ff6060','#b01a2a'],Q:['#c47bff','#6a1fc4'],S:['#ff4a78','#7a0f2a'],C:['#ffd84a','#c88a10'],T:['#fff08a','#e0a800'],R:['#47ece0','#0d8f95'],r:['#f1dcae','#b99560'],start:['#5fb8ff','#1a56c4'],home:['#ffe066','#ff8a1a']};
const PCOL=[['#58b6ff','#1766d1','#d5eeff'],['#c883ff','#6d1fc7','#f0daff']];
const PNAME=['Player 1','Player 2'];

/* ================= state ================= */
const S={level:0,turn:0,phase:'title',gid:0,roll:0,legal:[],picked:false,extra:false,shake:0,P:[],done:[false,false,false,false],titleLevel:0};
function mkPlayers(keep){
  const w=S.P.length?S.P.map(p=>p.wins):[0,0];
  S.P=[0,1].map(i=>({i,idx:0,z:0,hop:0,jump:null,stars:0,skip:0,wins:keep?w[i]:0}));
}
mkPlayers(false);

/* ================= audio ================= */
let actx=null,soundOn=true;
function ac(){if(!actx){try{actx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(actx&&actx.state==='suspended')actx.resume();return actx}
function tone(f,d=.1,type='sine',v=.1,delay=0,to=null){
  if(!soundOn)return;const a=ac();if(!a)return;const t=a.currentTime+delay;
  const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
  if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.03);
}
const sfx={
  hop(){tone(480+Math.random()*120,.08,'triangle',.12)},
  dice(){for(let i=0;i<7;i++)tone(200+Math.random()*300,.05,'square',.05,i*.06)},
  good(){[523,659,784,1047].forEach((f,i)=>tone(f,.14,'triangle',.11,i*.07))},
  bad(){[400,320,240,170].forEach((f,i)=>tone(f,.16,'sawtooth',.07,i*.09))},
  star(){tone(988,.1,'sine',.12);tone(1319,.2,'sine',.12,.09)},
  card(){[660,880,1100,1320].forEach((f,i)=>tone(f,.18,'sine',.08,i*.05))},
  pick(){tone(700,.07,'triangle',.1);tone(900,.09,'triangle',.1,.06)},
  zip(){tone(300,.5,'sine',.1,0,1200)},
  win(){[523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,.25,'triangle',.13,i*.12))}
};

/* ================= layout & projection ================= */
let W=0,H=0,dpr=1,topH=70,botH=110,rightPad=0,avail=500,cx=0,u0=40,yH=0,yS=0,hz=0,K=.03;
const BW=.88,HS=.44,CW=2.05;
let TL=[],BR=[],CEN=[],SPARK=[];
const sc=z=>1/(1+K*z);
const PX=(wx,z)=>{const s=sc(z);return{x:cx+wx*u0*s,y:yH+(yS-yH)*s,s}};
const lv=()=>LEVELS[S.level];
const wxf=z=>{const L=lv();return L.sgn*(L.A*Math.sin(TAU*z/L.per)+L.A2*Math.sin(TAU*z/L.per2))};
function frameAt(z){const w=wxf(z),d=(wxf(z+.02)-wxf(z-.02))/.04,len=Math.hypot(d,1);return{w,tx:d/len,tz:1/len,nx:1/len,nz:-d/len}}

function layout(){
  W=innerWidth;H=innerHeight;dpr=Math.min(2,window.devicePixelRatio||1);
  for(const c of[cv,skyC,fgC]){c.width=Math.round(W*dpr);c.height=Math.round(H*dpr)}
  const hud=$('#hud').getBoundingClientRect(),bt=$('#bottom').getBoundingClientRect();
  const side=bt.width<W*.7;
  topH=hud.bottom+8;botH=side?0:Math.max(90,H-bt.top-14);rightPad=side?bt.width:0;
  avail=Math.max(150,H-topH-botH);
  cx=(W-rightPad)/2;
  yS=topH+avail*.9;const yHome=topH+avail*.31;
  const s29=sc(GOAL);yH=(yHome-yS*s29)/(1-s29);
  hz=topH+avail*.37;
  const depth=(yS-yH)*(sc(0)-sc(1));
  const Ws=Math.min(W-rightPad,Math.max(avail*.95,360));
  u0=Math.min(Ws*.44/(lv().A+BW+.3),depth*3.4);
  buildGeometry();
}
function buildGeometry(){
  TL=[];
  const L=lv();
  for(let i=0;i<=GOAL;i++){
    const f=frameAt(i),c=PX(f.w,i);
    const pt=(a,b)=>PX(f.w+f.tx*a+f.nx*b,i+f.tz*a+f.nz*b);
    const poly=[pt(-HS,-HS),pt(HS,-HS),pt(HS,HS),pt(-HS,HS)];
    const e1=PX(f.w+f.tx*.5,i+f.tz*.5),e2=PX(f.w+f.nx*.5,i+f.nz*.5);
    TL.push({i,t:L.types[i],c,poly,U:{x:(e1.x-c.x)/.5,y:(e1.y-c.y)/.5},V:{x:(e2.x-c.x)/.5,y:(e2.y-c.y)/.5},hr:Math.max(22,HS*u0*c.s*1.35)});
  }
  BR=[];
  for(let z=-1;z<=30.401;z+=.25){
    const f=frameAt(z);
    BR.push({z,c:PX(f.w,z),l:PX(f.w-f.nx*BW,z-f.nz*BW),r:PX(f.w+f.nx*BW,z+f.nz*BW)});
  }
  CEN=[];
  for(let z=-2;z<=32;z+=.5){const c=PX(wxf(z),z);CEN.push({x:c.x,y:c.y,cw:CW*u0*c.s,s:c.s,z})}
}

/* ================= drawing helpers ================= */
const ell=(g,x,y,rx,ry)=>{g.beginPath();g.ellipse(x,y,Math.max(.01,rx),Math.max(.01,ry),0,0,TAU)};
function poly(g,pts,close=true){g.beginPath();pts.forEach((p,i)=>i?g.lineTo(p.x??p[0],p.y??p[1]):g.moveTo(p.x??p[0],p.y??p[1]));if(close)g.closePath()}
function glow(g,x,y,r,c,a=1){const gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,rgba(c,a));gr.addColorStop(1,rgba(c,0));g.fillStyle=gr;g.fillRect(x-r,y-r,r*2,r*2)}
function lgrad(g,x0,y0,x1,y1,stops){const gr=g.createLinearGradient(x0,y0,x1,y1);stops.forEach((c,i)=>gr.addColorStop(i/(stops.length-1),c));return gr}
function cloudBlob(g,x,y,s,c1,c2,a=1){
  g.save();g.globalAlpha=a;
  const parts=[[0,0,1],[.9,.15,.8],[-.9,.18,.75],[.4,-.35,.8],[-.45,-.3,.7],[1.5,.3,.5],[-1.5,.3,.5]];
  for(const[p,q,r]of parts){const gr=g.createRadialGradient(x+p*s,y+q*s-r*s*.25,0,x+p*s,y+q*s,r*s);gr.addColorStop(0,c1);gr.addColorStop(1,c2);g.fillStyle=gr;ell(g,x+p*s,y+q*s,r*s,r*s*.7);g.fill()}
  g.restore();
}
function tooClose(x,y,extra){for(const b of CEN){const dx=x-b.x,dy=(y-b.y)*1.7;if(Math.hypot(dx,dy)<b.cw+extra)return true}return false}
function scatter(n,rnd,y0,y1,extra,pw=1){
  const out=[];let tries=0;
  while(out.length<n&&tries<n*40){tries++;
    const x=-30+rnd()*(W+60),y=y0+Math.pow(rnd(),pw)*(y1-y0);
    if(tooClose(x,y,extra))continue;out.push({x,y,r:rnd(),r2:rnd()})}
  return out.sort((a,b)=>a.y-b.y);
}

/* ================= static scenery ================= */
function prep(c){const g=c.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,W,H);return g}
function stars(g,rnd,n,y1){g.fillStyle='#fff';for(let i=0;i<n;i++){g.globalAlpha=.3+rnd()*.7;const r=rnd()*1.4+.3;g.fillRect(rnd()*W,rnd()*y1,r,r)}g.globalAlpha=1}

function renderStatic(){
  const li=S.level,L=lv(),rnd=mulberry32(900+li*131);
  const g=prep(skyC),f=prep(fgC);
  SPARK=[];
  if(li===0)paintCitySky(g,rnd);
  else if(li===1)paintForestSky(g,rnd);
  else if(li===2)paintDesertSky(g,rnd);
  else paintSkyIslandSky(g,rnd);
  if(li<3){paintLand(g,li,rnd);paintChasm(g,li,rnd)}
  else paintMist(g,rnd);
  // sprites
  paintSprites(f,li,rnd);
  paintHome(f,li);
  paintBridge(f,L);
  paintStart(f,li);
  paintForeground(f,li,rnd);
}

/* ---- skies ---- */
function paintCitySky(g,rnd){
  g.fillStyle=lgrad(g,0,0,0,hz+20,['#120a30','#3a1670','#b43c84','#ff8f5f']);g.fillRect(0,0,W,H);
  stars(g,rnd,70,hz*.6);
  glow(g,W*.78,topH+avail*.14,90,[255,220,180],.55);g.fillStyle='#ffe9cf';ell(g,W*.78,topH+avail*.14,14,14);g.fill();
  glow(g,W*.5,hz+8,W*.7,[255,120,90],.5);
  for(let layer=0;layer<3;layer++){
    const base=hz+4+layer*10,col=['#2a1a58','#1f1445','#150c34'][layer];
    let x=-20;
    while(x<W+20){
      const bw=22+rnd()*40,bh=(50+rnd()*100)*(1+layer*.25);
      g.fillStyle=col;g.fillRect(x,base-bh,bw,bh+40);
      if(rnd()<.35){g.fillRect(x+bw*.4,base-bh-18-rnd()*18,2.5,22)}
      const wc=['#ffd77a','#7ae7ff','#ff7ad9'];
      for(let wy=base-bh+6;wy<base-4;wy+=9)for(let wx=x+4;wx<x+bw-5;wx+=8){
        if(rnd()<.32){g.fillStyle=wc[(rnd()*3)|0];g.globalAlpha=.35+layer*.25;g.fillRect(wx,wy,3.5,4.5);g.globalAlpha=1}}
      if(layer===2&&rnd()<.25){const cc=[[255,60,200],[60,220,255],[255,200,60]][(rnd()*3)|0];glow(g,x+bw/2,base-bh*.6,30,cc,.55);g.fillStyle=rgba(cc,.9);g.fillRect(x+bw*.2,base-bh*.65,bw*.6,5)}
      x+=bw+rnd()*4;
    }
  }
  // spotlights
  g.save();g.globalCompositeOperation='lighter';
  [[W*.2,-.3],[W*.62,.25]].forEach(([x,a])=>{g.fillStyle='rgba(180,140,255,.07)';g.beginPath();g.moveTo(x,hz);g.lineTo(x+Math.tan(a)*hz*1.4-26,0);g.lineTo(x+Math.tan(a)*hz*1.4+26,0);g.closePath();g.fill()});
  g.restore();
}
function paintForestSky(g,rnd){
  g.fillStyle=lgrad(g,0,0,0,hz+20,['#0e4b5a','#2f9a86','#9bd98c','#f5e8a0']);g.fillRect(0,0,W,H);
  glow(g,W*.3,hz-30,W*.55,[255,240,170],.55);
  g.fillStyle='#fffbe0';ell(g,W*.3,hz-20,22,22);g.fill();
  const cols=['#5fb59a','#3b9078','#1f6a5c','#124a42'];
  for(let l=0;l<4;l++){
    g.fillStyle=cols[l];g.globalAlpha=.75+l*.08;g.beginPath();g.moveTo(0,hz+30);
    const amp=70-l*12,bs=hz+8-(3-l)*6;
    for(let x=0;x<=W;x+=14)g.lineTo(x,bs-amp*(.45+.55*Math.abs(Math.sin(x*.011+l*2.3+rnd()*.05))));
    g.lineTo(W,hz+40);g.closePath();g.fill();
    g.fillStyle=`rgba(210,255,230,${.1+l*.02})`;g.fillRect(0,bs-12,W,26);
  }
  g.globalAlpha=1;
  // light shafts
  g.save();g.globalCompositeOperation='lighter';
  for(let i=0;i<5;i++){const x=W*.12+i*W*.19;g.fillStyle='rgba(255,250,190,.05)';g.beginPath();g.moveTo(W*.3,hz-20);g.lineTo(x-24,H);g.lineTo(x+24,H);g.closePath();g.fill()}
  g.restore();
}
function paintDesertSky(g,rnd){
  g.fillStyle=lgrad(g,0,0,0,hz+20,['#3b1a4a','#b83f4a','#ff8a3d','#ffd27a']);g.fillRect(0,0,W,H);
  stars(g,rnd,25,hz*.35);
  const sx=W*.68,sy=hz-40;glow(g,sx,sy,W*.6,[255,170,70],.6);
  g.fillStyle=lgrad(g,0,sy-46,0,sy+46,['#fff3b0','#ffb347']);ell(g,sx,sy,44,44);g.fill();
  const cols=['#c4573a','#9c3a2c','#6e2420'];
  for(let l=0;l<3;l++){
    const base=hz+6+l*8;g.fillStyle=cols[l];
    let x=-30;
    while(x<W+30){
      const w=50+rnd()*90,h=(28+rnd()*55)*(1+l*.15);
      g.beginPath();g.moveTo(x,base+30);g.lineTo(x+w*.08,base-h*.55);g.lineTo(x+w*.14,base-h*.62);g.lineTo(x+w*.17,base-h);g.lineTo(x+w*.83,base-h);g.lineTo(x+w*.86,base-h*.62);g.lineTo(x+w*.92,base-h*.55);g.lineTo(x+w,base+30);g.closePath();g.fill();
      g.fillStyle='rgba(0,0,0,.18)';g.fillRect(x+w*.17,base-h*.5,w*.66,2);g.fillStyle=cols[l];
      x+=w*.7+rnd()*30;
    }
    g.fillStyle=`rgba(255,170,90,${.12})`;g.fillRect(0,base-6,W,22);
  }
}
function paintSkyIslandSky(g,rnd){
  g.fillStyle=lgrad(g,0,0,0,H,['#0b0a3c','#2b1a7a','#7a3fb0','#e56aa0','#ffb98a']);g.fillRect(0,0,W,H);
  stars(g,rnd,140,H*.55);
  glow(g,W*.22,topH+avail*.2,120,[190,200,255],.5);g.fillStyle='#eef1ff';ell(g,W*.22,topH+avail*.2,20,20);g.fill();
  g.fillStyle='rgba(140,150,230,.35)';ell(g,W*.22+7,topH+avail*.2-4,18,18);g.fill();
  // distant cloud bank
  for(let i=0;i<14;i++)cloudBlob(g,rnd()*W,hz+rnd()*(H-hz),50+rnd()*70,'rgba(255,225,240,.9)','rgba(190,120,200,.35)',.45);
}
function paintMist(g,rnd){
  const pts=[];
  for(let i=0;i<CEN.length;i++){const f=frameAt(CEN[i].z);const c=CEN[i];pts.push(c)}
  g.save();g.globalCompositeOperation='lighter';
  for(const c of CEN){if(c.y<topH)continue;glow(g,c.x,c.y+c.s*u0*1.1,c.cw*1.15,[255,170,220],.12)}
  g.restore();
  for(let i=0;i<10;i++)cloudBlob(g,rnd()*W,hz+30+rnd()*(H-hz-20),40+rnd()*60,'rgba(255,236,246,.95)','rgba(200,140,210,.4)',.35);
}

/* ---- land & chasm ---- */
function paintLand(g,li,rnd){
  const cols=[['#2a2146','#0d0a1f'],['#2c6a3a','#0e2e1c'],['#b25a35','#5a2316']][li];
  g.fillStyle=lgrad(g,0,hz-4,0,H,[cols[0],cols[1]]);g.fillRect(0,hz-4,W,H-hz+4);
  if(li===0){ // street grid glow
    g.strokeStyle='rgba(120,100,220,.14)';g.lineWidth=1;
    for(let y=hz+10;y<H;y+=(y-hz)*.22+8){g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke()}
  }
  if(li===2){ // dunes
    for(let i=0;i<9;i++){const y=hz+20+rnd()*(H-hz),x=rnd()*W,w=90+rnd()*160;g.fillStyle=`rgba(255,${150+rnd()*60|0},90,.10)`;ell(g,x,y,w,w*.14);g.fill()}
  }
}
function chasmPoly(m){
  const L=[],R=[];
  for(let z=-1.8;z<=31.5;z+=.4){const f=frameAt(z);L.push(PX(f.w-f.nx*CW*m,z-f.nz*CW*m));R.push(PX(f.w+f.nx*CW*m,z+f.nz*CW*m))}
  return L.concat(R.reverse());
}
function paintChasm(g,li,rnd){
  g.save();g.beginPath();g.rect(0,hz-6,W,H);g.clip();
  // bank shadow
  poly(g,chasmPoly(1.18));g.fillStyle='rgba(0,0,0,.28)';g.fill();
  const fills=[['#0c2a5a','#07153a'],['#2a8fb0','#0b4a6a'],['#2a0d0a','#080202']][li];
  poly(g,chasmPoly(1));g.fillStyle=lgrad(g,0,hz,0,H,fills);g.fill();
  poly(g,chasmPoly(.55));g.fillStyle=li===1?'rgba(10,60,90,.45)':'rgba(0,0,0,.35)';g.fill();
  g.lineJoin='round';
  poly(g,chasmPoly(1));g.lineWidth=3;g.strokeStyle=['rgba(120,170,255,.45)','rgba(230,255,255,.6)','rgba(255,140,60,.55)'][li];g.stroke();
  if(li===2){ // lava glow veins
    g.save();g.globalCompositeOperation='lighter';
    for(const c of CEN){if(c.y<hz)continue;glow(g,c.x,c.y+c.cw*.15,c.cw*.85,[255,90,20],.16)}
    g.restore();
  }
  if(li===1){ // foam streaks
    g.strokeStyle='rgba(255,255,255,.35)';g.lineWidth=2;
    for(let i=0;i<40;i++){const c=CEN[(rnd()*CEN.length)|0];const dx=(rnd()-.5)*c.cw*1.6;g.beginPath();g.moveTo(c.x+dx,c.y+4);g.lineTo(c.x+dx+14*c.s,c.y+4+rnd()*3);g.stroke()}
  }
  g.restore();
  // shimmer points
  for(let i=0;i<110;i++){const c=CEN[(rnd()*CEN.length)|0];if(c.y<hz+4)continue;SPARK.push({x:c.x+(rnd()-.5)*c.cw*1.5,y:c.y+(rnd()-.2)*c.cw*.4+c.s*u0*.6,ph:rnd()*TAU,w:6+rnd()*14*c.s,li})}
}

/* ---- sprites ---- */
function paintSprites(g,li,rnd){
  const ty0=li===3?topH+16:hz+6;
  if(li===0){
    const list=scatter(34,rnd,hz+6,H+10,34,.9);
    for(const p of list){const t=clamp((p.y-hz)/(H-hz),0,1),k=lerp(.45,1.35,t);
      if(p.r<.72)drawBuilding(g,p.x,p.y,(34+p.r2*40)*k,(80+p.r*170)*k,rnd);
      else drawLamp(g,p.x,p.y,k);}
  }else if(li===1){
    const list=scatter(120,rnd,hz+4,H+10,26,.85);
    for(const p of list){const t=clamp((p.y-hz)/(H-hz),0,1),k=lerp(.35,1.3,t);
      if(p.r<.55)drawPine(g,p.x,p.y,(70+p.r2*60)*k,p.r2);
      else if(p.r<.72)drawOak(g,p.x,p.y,(60+p.r2*40)*k);
      else if(p.r<.84)drawRock(g,p.x,p.y,(16+p.r2*20)*k,['#6f7f78','#3d4a46']);
      else if(p.r<.95)drawBush(g,p.x,p.y,(20+p.r2*16)*k);
      else drawShroom(g,p.x,p.y,k);}
    // treehouse
    const th=scatter(1,mulberry32(7),hz+30,hz+(H-hz)*.45,60)[0];if(th)drawTreehouse(g,th.x,th.y,clamp((th.y-hz)/(H-hz),0,1)*.9+.6);
  }else if(li===2){
    const list=scatter(40,rnd,hz+6,H+10,36,.9);
    for(const p of list){const t=clamp((p.y-hz)/(H-hz),0,1),k=lerp(.4,1.3,t);
      if(p.r<.3)drawMesa(g,p.x,p.y,(80+p.r2*110)*k,(50+p.r*120)*k,rnd);
      else if(p.r<.62)drawCactus(g,p.x,p.y,(40+p.r2*40)*k);
      else if(p.r<.88)drawRock(g,p.x,p.y,(14+p.r2*24)*k,['#b0603e','#6a2e1e']);
      else drawDeadTree(g,p.x,p.y,(40+p.r2*30)*k);}
  }else{
    const list=scatter(16,rnd,topH+14,H-botH*.4,70,1);
    for(const p of list){const t=clamp((p.y-topH)/(H-topH),0,1),k=lerp(.55,1.25,t);drawIsland(g,p.x,p.y,(70+p.r*90)*k,p.r2,rnd,true)}
  }
}
function drawBuilding(g,x,y,w,h,r){
  const pal=[['#3d2a78','#241852'],['#2b3f86','#1a2358'],['#6a2c78','#321746'],['#2f5a86','#172a50']][(r()*4)|0];
  g.fillStyle=lgrad(g,x-w/2,0,x+w/2,0,pal);g.fillRect(x-w/2,y-h,w,h);
  g.fillStyle='rgba(0,0,0,.38)';g.fillRect(x+w*.34,y-h,w*.16,h);
  const wc=['#ffd77a','#7ae7ff','#ff9be0','#fff3c4'];
  const cols=Math.max(2,Math.floor(w/10)),rows=Math.max(2,Math.floor(h/13));
  for(let i=0;i<rows;i++)for(let j=0;j<cols;j++){if(r()<.55){g.fillStyle=wc[(r()*4)|0];g.fillRect(x-w/2+4+j*((w*.66)/cols),y-h+8+i*13,w*.66/cols-3,7)}}
  g.fillStyle='#0d0820';g.fillRect(x-w/2-2,y-h-3,w+4,4);
  if(r()<.5){g.fillRect(x,y-h-22,2,20);glow(g,x+1,y-h-22,8,[255,60,60],.8)}
  if(r()<.4){const cc=[[255,70,210],[70,230,255],[255,210,70]][(r()*3)|0];glow(g,x,y-h*.3,w*.8,cc,.35);g.fillStyle=rgba(cc,.95);g.fillRect(x-w*.3,y-h*.3,w*.6,Math.max(4,w*.09))}
}
function drawLamp(g,x,y,k){
  g.strokeStyle='#241b3d';g.lineWidth=3*k;g.beginPath();g.moveTo(x,y);g.lineTo(x,y-60*k);g.lineTo(x+14*k,y-64*k);g.stroke();
  glow(g,x+14*k,y-62*k,34*k,[255,220,140],.8);g.fillStyle='#fff6d0';ell(g,x+14*k,y-62*k,4*k,4*k);g.fill();
}
function drawPine(g,x,y,s,v){
  g.fillStyle='#3b2a1a';g.fillRect(x-s*.035,y-s*.2,s*.07,s*.2);
  const c=[['#0d4a34','#146a48'],['#0f5a3e','#1b7d58'],['#12694a','#26926a'],['#0a3f2e','#10583f']][(v*4)|0];
  for(let k=0;k<4;k++){const yy=y-s*.14-k*s*.19,ww=s*.52*(1-k*.17);
    g.fillStyle=lgrad(g,x-ww/2,0,x+ww/2,0,[c[0],c[1]]);g.beginPath();g.moveTo(x-ww/2,yy);g.lineTo(x+ww/2,yy);g.lineTo(x,yy-s*.33);g.closePath();g.fill()}
}
function drawOak(g,x,y,s){
  g.fillStyle='#4a3220';g.fillRect(x-s*.05,y-s*.4,s*.1,s*.4);
  [[0,-.62,.3],[-.2,-.5,.22],[.2,-.5,.22],[0,-.78,.2]].forEach(([a,b,r])=>{const gr=g.createRadialGradient(x+a*s-r*s*.3,y+b*s-r*s*.3,0,x+a*s,y+b*s,r*s);gr.addColorStop(0,'#5fc46a');gr.addColorStop(1,'#1f6a3a');g.fillStyle=gr;ell(g,x+a*s,y+b*s,r*s,r*s*.9);g.fill()});
}
function drawRock(g,x,y,s,c){g.fillStyle=lgrad(g,x-s,y-s,x+s,y,[c[0],c[1]]);g.beginPath();g.moveTo(x-s,y);g.lineTo(x-s*.7,y-s*.7);g.lineTo(x-s*.1,y-s*.95);g.lineTo(x+s*.6,y-s*.6);g.lineTo(x+s,y);g.closePath();g.fill()}
function drawBush(g,x,y,s){[[-.5,0],[.5,0],[0,-.4]].forEach(([a,b])=>{g.fillStyle=lgrad(g,0,y+b*s-s,0,y+b*s+s,['#4fb85a','#1f6a34']);ell(g,x+a*s,y+b*s-s*.4,s*.7,s*.6);g.fill()})}

function run(fn){return(async()=>{try{await fn()}catch(e){if(e!==CANCEL)console.error(e)}})()}
async function w(ms){const g=S.gid;await sleep(ms);if(g!==S.gid)throw CANCEL}
function tween(ms,fn){const g=S.gid;return new Promise((res,rej)=>{const t0=performance.now();(function f(){if(g!==S.gid)return rej(CANCEL);const k=Math.min(1,(performance.now()-t0)/ms);fn(k);if(k<1)requestAnimationFrame(f);else res()})()})}

function computeLegal(){
  const pl=S.P[S.turn],n=S.roll,L=lv(),opts=[];
  const add=(d,zip)=>{d=Math.min(GOAL,d);if(d>pl.idx&&!opts.some(o=>o.dest===d))opts.push({dest:d,label:(zip?'🚠':'+'+(d-pl.idx))})};
  add(pl.idx+n);
  if(n>=2)add(pl.idx+Math.max(1,Math.floor(n/2)));
  for(const[s]of L.ropes)if(s>pl.idx&&s<=pl.idx+n)add(s,true);
  S.legal=opts;
}
function doRoll(){
  if(S.phase!=='idle')return;
  ac();
  run(async()=>{
    S.phase='rolling';updateUI();sfx.dice();say('Rolling…');
    const d=$('#dice');d.classList.remove('land');d.classList.add('rolling');
    const n=1+Math.floor(Math.random()*6);
    for(let i=0;i<8;i++){setDie(1+Math.floor(Math.random()*6));await w(70)}
    d.classList.remove('rolling');setDie(n);void d.offsetWidth;d.classList.add('land');
    S.roll=n;computeLegal();S.phase='select';S.picked=false;updateUI();
    const o=S.legal.length;
    say(`${PNAME[S.turn]} rolled a ${n}! Tap your piece, then a glowing space.`,'good');
  });
}
function hitPiece(x,y){
  const pi=S.turn,q=piecePos(pi),r=pawnRadius(q.s),share=Math.abs(S.P[0].z-S.P[1].z)<.7;
  const px=q.x+(share?(pi?1:-1)*r*.85:0);

}

  // legal tile?
  let best=null,bd=1e9;
  for(const o of S.legal){const tl=TL[o.dest];const d=Math.hypot(x-tl.c.x,y-tl.c.y);if(d<tl.hr*1.25+6&&d<bd){bd=d;best=o}}
  if(best){chooseMove(best.dest);return}
  if(hitPiece(x,y)){S.picked=true;sfx.pick();say('Now tap one of the glowing spaces!','good');const q=piecePos(S.turn);spark(q.x,q.y-20,'#fff6b0',8,70,.5)}
  else if(!S.picked)say('Tap your piece first (the one bouncing), then pick a glowing space.','warn');
  else say('Tap a glowing space to move there.','warn');
}
function chooseMove(dest){
  if(S.phase!=='select')return;
  S.phase='moving';S.legal=[];updateUI();
  const pi=S.turn;
  run(async()=>{
    const p=S.P[pi];
    const L=lv();
    const rope=L.ropes.find(r=>r[0]===dest);
    await hopTo(pi,dest);
    await resolve(pi,0);
    if(S.phase==='over')return;
    // bump
    const o=S.P[1-pi];
    if(p.idx===o.idx&&p.idx>0&&p.idx<GOAL){
      sfx.bad();S.shake=.6;say(`💥 Bump! ${PNAME[1-pi]} gets knocked back 2 spaces!`,'warn');
      const q=piecePos(1-pi);spark(q.x,q.y-12,'#ffb04a',16,150,.8);
      await w(700);await hopTo(1-pi,Math.max(0,o.idx-2));
    }
    await endTurn(pi);
  });
}
async function hopTo(pi,dest){
  const p=S.P[pi];
  while(p.idx!==dest){
    const dir=dest>p.idx?1:-1,from=p.idx,to=from+dir;
    sfx.hop();
    await tween(dir>0?210:170,k=>{p.z=lerp(from,to,k);p.hop=Math.sin(Math.PI*k)*.62});
    p.z=to;p.idx=to;p.hop=0;
    const q=piecePos(pi);spark(q.x,q.y,'rgba(255,230,170,.9)',4,50,.35);
  }
}
async function zip(pi,dest){
  const p=S.P[pi];sfx.zip();
  const a=p.idx;p.jump={a,b:dest,k:0};
  await tween(850,k=>{p.jump.k=k});
  p.jump=null;p.idx=dest;p.z=dest;
  const q=piecePos(pi);spark(q.x,q.y,'#6dfff0',18,160,.8);
}
async function resolve(pi,depth){
  const p=S.P[pi],L=lv(),ty=L.types[p.idx],nm=PNAME[pi];
  const pp=()=>{const q=piecePos(pi);return q};
  if(p.idx>=GOAL){await win(pi);return}
  if(ty==='F'){
    sfx.good();say(`⬆ Boost! ${nm} hops ahead 2!`,'good');{const q=pp();floatText(q.x,q.y-40,'+2','#7dff9a');spark(q.x,q.y,'#7dff9a',14,120)}
    await w(450);await hopTo(pi,Math.min(GOAL,p.idx+2));
    if(p.idx>=GOAL){await win(pi);return}
    if(depth<2)await resolve(pi,depth+1);
  }else if(ty==='B'){
    sfx.bad();S.shake=.5;say(`⬇ Oops! ${nm} slips back 3 spaces!`,'warn');{const q=pp();floatText(q.x,q.y-40,'-3','#ff7a7a');spark(q.x,q.y,'#ff6060',14,120)}
    await w(500);await hopTo(pi,Math.max(0,p.idx-3));
  }else if(ty==='Q'){
    await drawCard(pi,depth);
  }else if(ty==='S'){
    sfx.bad();S.shake=.6;p.skip++;say(`💀 Broken plank! ${nm} loses the next turn.`,'warn');{const q=pp();floatText(q.x,q.y-40,'LOSE TURN','#ff7a9a');spark(q.x,q.y,'#ff4a78',16,130)}
    await w(1000);
  }else if(ty==='C'){
    sfx.star();p.stars+=2;S.extra=true;updateUI();say(`💰 Treasure! ${nm} grabs 2 stars and rolls again!`,'good');{const q=pp();floatText(q.x,q.y-40,'+2 ⭐','#ffe27a');spark(q.x,q.y,'#ffd84a',24,160,1)}
    await w(1000);
  }else if(ty==='T'){
    sfx.star();p.stars+=1;updateUI();say(`⭐ ${nm} found a bonus star!`,'good');{const q=pp();floatText(q.x,q.y-40,'+1 ⭐','#ffe27a');spark(q.x,q.y,'#fff08a',14,130)}
    await w(650);
  }else if(ty==='R'){
    const end=L.ropes.find(r=>r[0]===p.idx)[1];
    say(`🚠 Zipline! ${nm} zooms ahead!`,'good');await w(350);await zip(pi,end);sfx.good();
    await w(250);
  }
}
function drawCard(pi,depth){
  const p=S.P[pi],L=lv(),card=L.cards[Math.floor(Math.random()*L.cards.length)];
  sfx.card();
  let fx='',col='#ffe27a';
  if(card.mv>0){fx=`Move forward ${card.mv}!`;col='#7dff9a'}
  else if(card.mv<0){fx=`Go back ${-card.mv} spaces!`;col='#ff7a7a'}
  else if(card.st){fx=`+${card.st} Stars ⭐`}
  else if(card.skip){fx='Lose your next turn';col='#ff7a9a'}
  else if(card.again){fx='Roll again! 🎲';col='#7dff9a'}
  else if(card.opp){fx=`Rival goes back ${-card.opp}!`;col='#7dff9a'}
  else if(card.swap){fx='Swap places! 🔄';col='#6dfff0'}
  say(`❓ ${PNAME[pi]} drew a Chance Card!`);
  return new Promise(res=>{
    showModal(`<div class="bigcard"><div class="sub">Chance Card</div><div class="em">${card.e}</div><h3>${card.t}</h3><p>${card.x}</p><div class="fx" style="color:${col}">${fx}</div></div><div class="row"><button class="btn pri" id="cardOk" style="font-size:19px">OK!</button></div>`);
    $('#cardOk').onclick=()=>{hideModal();run(async()=>{await applyCard(pi,card,depth);res()})};
  });
}
async function applyCard(pi,card,depth){
  const p=S.P[pi],o=S.P[1-pi],nm=PNAME[pi];
  if(card.mv>0){await hopTo(pi,Math.min(GOAL,p.idx+card.mv));if(p.idx>=GOAL){await win(pi);return}if(depth<2)await resolve(pi,depth+1)}
  else if(card.mv<0){sfx.bad();S.shake=.35;await hopTo(pi,Math.max(0,p.idx+card.mv))}
  else if(card.st){sfx.star();p.stars+=card.st;updateUI();const q=piecePos(pi);floatText(q.x,q.y-40,`+${card.st} ⭐`,'#ffe27a');spark(q.x,q.y,'#ffd84a',22,150,1);await w(800)}
  else if(card.skip){p.skip++;sfx.bad();await w(500)}
  else if(card.again){S.extra=true;sfx.good();await w(500)}
  else if(card.opp){sfx.good();say(`${PNAME[1-pi]} is knocked back!`,'good');await w(500);await hopTo(1-pi,Math.max(0,o.idx+card.opp))}
  else if(card.swap){
    if(p.idx===o.idx){await w(300);return}
    sfx.zip();const a=p.idx,b=o.idx;p.jump={a,b,k:0};o.jump={a:b,b:a,k:0};
    await tween(950,k=>{p.jump.k=k;o.jump.k=k});
    p.jump=null;o.jump=null;p.idx=b;p.z=b;o.idx=a;o.z=a;
    spark(piecePos(pi).x,piecePos(pi).y,'#6dfff0',16,140,.8);spark(piecePos(1-pi).x,piecePos(1-pi).y,'#6dfff0',16,140,.8);
    await w(300);
  }
}
async function endTurn(pi){
  if(S.extra){S.extra=false;say(`${PNAME[pi]} rolls again!`,'good');await w(800);S.phase='idle';updateUI();idleMsg();return}
  S.turn=1-pi;updateUI();
  while(S.P[S.turn].skip>0){
    S.P[S.turn].skip--;say(`${PNAME[S.turn]} loses this turn!`,'warn');sfx.bad();await w(1200);
    S.turn=1-S.turn;updateUI();
  }
  S.phase='idle';updateUI();idleMsg();
}
async function win(pi){
  if(S.phase==='over')return;
  S.phase='over';const p=S.P[pi];p.wins++;S.done[S.level]=true;
  updateUI();sfx.win();confetti();say(`🏠 ${PNAME[pi]} got HOME!`,'good');
  const q=piecePos(pi);spark(q.x,q.y-20,'#ffe27a',40,220,1.2);
  await w(1400);
  const last=S.level>=LEVELS.length-1;
  const done=S.done.filter(Boolean).length;
  showModal(`<h2>🏠 ${PNAME[pi]} got HOME!</h2>
  <p style="text-align:center;font-size:16px">${LEVELS[S.level].emoji} ${LEVELS[S.level].name} complete!</p>
  <p style="text-align:center">⭐ Stars this level — P1: <b>${S.P[0].stars}</b> &nbsp;|&nbsp; P2: <b>${S.P[1].stars}</b></p>
  <p style="text-align:center;font-size:16px">🏆 Series wins — P1: <b>${S.P[0].wins}</b> &nbsp;|&nbsp; P2: <b>${S.P[1].wins}</b></p>
  ${last?`<p style="text-align:center;color:#ffe27a;font-weight:900">You've crossed all four adventures! ${S.P[0].wins===S.P[1].wins?'It\'s a tie — rematch?':PNAME[S.P[0].wins>S.P[1].wins?0:1]+' is the Great Bridge Champion!'}</p>`:''}
  <div class="row">
   ${last?`<button class="btn pri" id="wNext" style="font-size:17px">↺ Play Again (Level 1)</button>`:`<button class="btn pri" id="wNext" style="font-size:17px">Next Level ▶</button>`}
   <button class="btn gold" id="wAgain">Replay Level</button>
   <button class="btn gold" id="wLv">Levels</button></div>`);
  const starter=1-pi;
  $('#wNext').onclick=()=>{startLevel(last?0:S.level+1,true);S.turn=starter;updateUI();idleMsg()};
  $('#wAgain').onclick=()=>{startLevel(S.level,true);S.turn=starter;updateUI();idleMsg()};
  $('#wLv').onclick=levelModal;
}

/* ================= events ================= */
cv.addEventListener('pointerdown',e=>{const r=cv.getBoundingClientRect();onTap(e.clientX-r.left,e.clientY-r.top)});
$('#btnRoll').onclick=()=>{ac();doRoll()};
$('#dice').onclick=()=>{ac();doRoll()};
$('#dice').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();doRoll()}});
$('#btnNew').onclick=()=>{ac();confirmNew()};
$('#btnMenu').onclick=()=>{ac();menuModal()};
$('#lvlchip').onclick=()=>{ac();levelModal()};
window.addEventListener('keydown',e=>{
  if(e.target&&e.target.id==='dice')return;
  if(e.code==='Space'&&S.phase==='idle'&&$('#modal').classList.contains('hidden')&&$('#title').classList.contains('hidden')){e.preventDefault();doRoll()}
  if(e.key==='Escape'&&!$('#modal').classList.contains('hidden')&&$('#cardOk')===null)hideModal();
});
$('#titleLevels').innerHTML=levelButtons(0,true);
function bindTitleLevels(){$('#titleLevels').querySelectorAll('.lvbtn').forEach(b=>b.onclick=()=>{S.titleLevel=+b.dataset.lv;sfx.pick();$('#titleLevels').innerHTML=levelButtons(S.titleLevel,true);bindTitleLevels();
  S.level=S.titleLevel;layout();renderStatic();updateUI()})}
bindTitleLevels();
$('#btnStart').onclick=()=>{ac();$('#title').classList.add('hidden');S.turn=0;startLevel(S.titleLevel,false);S.turn=0;updateUI();idleMsg();sfx.good()};
$('#btnHow').onclick=()=>{ac();rulesModal()};
let rzT=null;
window.addEventListener('resize',()=>{clearTimeout(rzT);rzT=setTimeout(()=>{layout();renderStatic()},120)});
window.addEventListener('orientationchange',()=>{setTimeout(()=>{layout();renderStatic()},250)});

/* ================= boot ================= */
setDie(6);
layout();renderStatic();updateUI();
requestAnimationFrame(frame);
window.__GETHOME={S};
})();
</script>
